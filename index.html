      if (!audioContext || audioContext.state !== "running") return;
      ensureMainReverbGraph();

      const now = audioContext.currentTime;
      audioClapIgnoreUntil = performance.now() + CLAP_DISSOLVE_GUARD_MS;

      const master = audioContext.createGain();
      const darkFilter = audioContext.createBiquadFilter();
      const compressor = audioContext.createDynamicsCompressor();

      darkFilter.type = "lowpass";
      darkFilter.frequency.setValueAtTime(1050, now);
      darkFilter.frequency.exponentialRampToValueAtTime(320, now + 3.6);
      darkFilter.Q.value = 0.16;

      compressor.threshold.value = -28;
      compressor.knee.value = 28;
      compressor.ratio.value = 1.45;
      compressor.attack.value = 0.10;
      compressor.release.value = 0.95;

      // 어택이 거의 느껴지지 않게 서서히 피었다가 4초 이상 길게 사라진다.
      master.gain.setValueAtTime(0.0001, now);
      master.gain.exponentialRampToValueAtTime(0.050, now + 0.48);
      master.gain.exponentialRampToValueAtTime(0.043, now + 1.10);
      master.gain.exponentialRampToValueAtTime(0.017, now + 2.55);
      master.gain.exponentialRampToValueAtTime(0.0001, now + 4.65);

      const tones = [
        { from: 146.83, to: 73.42,  gain: 0.52 },
        { from: 220.00, to: 110.00, gain: 0.24 },
        { from: 293.66, to: 146.83, gain: 0.080 }
      ];

      tones.forEach((tone, i) => {
        const osc = audioContext.createOscillator();
        const g = audioContext.createGain();

        osc.type = "sine";
        osc.frequency.setValueAtTime(tone.from, now);
        osc.frequency.exponentialRampToValueAtTime(tone.to, now + 3.55);

        g.gain.setValueAtTime(0.0001, now);
        g.gain.exponentialRampToValueAtTime(tone.gain, now + 0.42 + i * 0.06);
        g.gain.exponentialRampToValueAtTime(tone.gain * 0.48, now + 1.35);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 4.25);

        osc.connect(g);
        g.connect(master);
        osc.start(now);
        osc.stop(now + 4.45);
      });

      // 아주 약한 저역 공기 흐름만 추가. '파앗' 같은 노이즈 어택은 제거.
      const noiseBuffer = audioContext.createBuffer(1, Math.floor(audioContext.sampleRate * 4.2), audioContext.sampleRate);
      const nd = noiseBuffer.getChannelData(0);
      let smooth = 0;
      for (let i = 0; i < nd.length; i++) {
        smooth += ((Math.random() * 2 - 1) - smooth) * 0.018;
        const x = i / nd.length;
        nd[i] = smooth * Math.pow(1 - x, 0.45);
      }
      const noise = audioContext.createBufferSource();
      const noiseFilter = audioContext.createBiquadFilter();
      const noiseGain = audioContext.createGain();

      noise.buffer = noiseBuffer;
      noiseFilter.type = "bandpass";
      noiseFilter.frequency.setValueAtTime(420, now);
      noiseFilter.frequency.exponentialRampToValueAtTime(190, now + 3.5);
      noiseFilter.Q.value = 0.30;

      noiseGain.gain.setValueAtTime(0.0001, now);
      noiseGain.gain.exponentialRampToValueAtTime(0.080, now + 0.65);
      noiseGain.gain.exponentialRampToValueAtTime(0.025, now + 2.1);
      noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + 4.0);

      noise.connect(noiseFilter);
      noiseFilter.connect(noiseGain);
      noiseGain.connect(master);
      noise.start(now);
      noise.stop(now + 4.2);

      master.connect(darkFilter);
      darkFilter.connect(compressor);

      const dry = audioContext.createGain();
      const wet = audioContext.createGain();
      dry.gain.value = 0.46;
      wet.gain.value = 0.78;

      compressor.connect(dry);
      compressor.connect(wet);
      dry.connect(mainReverbDryGain);
      wet.connect(mainReverb);

      setAmbientTargetGain(AMBIENT_TRANSITION_GAIN * 0.70, 0.85);

      setTimeout(() => {
        try { master.disconnect(); } catch (_) {}
        try { darkFilter.disconnect(); } catch (_) {}
        try { compressor.disconnect(); } catch (_) {}
        try { dry.disconnect(); } catch (_) {}
        try { wet.disconnect(); } catch (_) {}
      }, 5600);
    }

    function playRestoreWhoosh() {
      if (!audioContext || audioContext.state !== "running") return;
      ensureMainReverbGraph();

      const now = audioContext.currentTime;
      audioClapIgnoreUntil = performance.now() + CLAP_RESTORE_GUARD_MS;

      const master = audioContext.createGain();
      const warmFilter = audioContext.createBiquadFilter();
      const compressor = audioContext.createDynamicsCompressor();

      warmFilter.type = "lowpass";
      warmFilter.frequency.setValueAtTime(520, now);
      warmFilter.frequency.exponentialRampToValueAtTime(1450, now + 2.1);
      warmFilter.frequency.exponentialRampToValueAtTime(1050, now + 4.2);
      warmFilter.Q.value = 0.16;

      compressor.threshold.value = -28;
      compressor.knee.value = 28;
      compressor.ratio.value = 1.45;
      compressor.attack.value = 0.09;
      compressor.release.value = 0.95;

      master.gain.setValueAtTime(0.0001, now);
      master.gain.exponentialRampToValueAtTime(0.018, now + 0.42);
      master.gain.exponentialRampToValueAtTime(0.049, now + 1.28);
      master.gain.exponentialRampToValueAtTime(0.041, now + 2.05);
      master.gain.exponentialRampToValueAtTime(0.0001, now + 4.85);

      // 낮은 음이 위로 모이며 최종적으로 따뜻한 코드가 형성되는 구조.
      const rises = [
        { from: 73.42,  to: 146.83, gain: 0.46 },
        { from: 110.00, to: 185.00, gain: 0.25 },
        { from: 146.83, to: 220.00, gain: 0.12 }
      ];

      rises.forEach((tone, i) => {
        const osc = audioContext.createOscillator();
        const g = audioContext.createGain();

        osc.type = "sine";
        osc.frequency.setValueAtTime(tone.from, now);
        osc.frequency.exponentialRampToValueAtTime(tone.to, now + 1.65 + i * 0.10);

        g.gain.setValueAtTime(0.0001, now);
        g.gain.exponentialRampToValueAtTime(tone.gain * 0.32, now + 0.40);
        g.gain.exponentialRampToValueAtTime(tone.gain, now + 1.38 + i * 0.08);
        g.gain.exponentialRampToValueAtTime(tone.gain * 0.36, now + 2.55);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 4.55);

        osc.connect(g);
        g.connect(master);
        osc.start(now);
        osc.stop(now + 4.70);
      });

      // 최종 구체가 잡힐 때 '딩'이 아니라 아주 은은한 코드의 잔광만 남긴다.
      const settle = [
        { f: 146.83, gain: 0.15 },
        { f: 185.00, gain: 0.090 },
        { f: 220.00, gain: 0.055 },
        { f: 293.66, gain: 0.020 }
      ];

      settle.forEach((tone, i) => {
        const osc = audioContext.createOscillator();
        const g = audioContext.createGain();

        osc.type = "sine";
        osc.frequency.value = tone.f;

        g.gain.setValueAtTime(0.0001, now);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 0.85);
        g.gain.exponentialRampToValueAtTime(tone.gain, now + 1.65 + i * 0.035);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 4.80);

        osc.connect(g);
        g.connect(master);
        osc.start(now);
        osc.stop(now + 4.95);
      });

      master.connect(warmFilter);
      warmFilter.connect(compressor);

      const dry = audioContext.createGain();
      const wet = audioContext.createGain();
      dry.gain.value = 0.44;
      wet.gain.value = 0.82;

      compressor.connect(dry);
      compressor.connect(wet);
      dry.connect(mainReverbDryGain);
      wet.connect(mainReverb);

      setAmbientTargetGain(AMBIENT_TRANSITION_GAIN * 0.78, 0.85);

      setTimeout(() => {
        try { master.disconnect(); } catch (_) {}
        try { warmFilter.disconnect(); } catch (_) {}
        try { compressor.disconnect(); } catch (_) {}
        try { dry.disconnect(); } catch (_) {}
        try { wet.disconnect(); } catch (_) {}
      }, 5700);
    }

    // ============================================================
    // 7. 구체 복제 완료음
    // ============================================================
    function createChimeImpulse(ctx, seconds = 5.8, decay = 3.0) {
      const rate = ctx.sampleRate;
      const length = Math.max(1, Math.floor(rate * seconds));
      const impulse = ctx.createBuffer(2, length, rate);

      for (let ch = 0; ch < impulse.numberOfChannels; ch++) {
        const data = impulse.getChannelData(ch);
        let smoothNoise = 0;
        let slowNoise = 0;

        for (let i = 0; i < length; i++) {
          const x = i / length;
          const white = Math.random() * 2 - 1;

          // 거친 고주파 잔향을 없애고 부드러운 저중역 확산만 남긴다.
          smoothNoise += (white - smoothNoise) * 0.055;
          slowNoise += (smoothNoise - slowNoise) * 0.018;

          const envelope = Math.pow(1 - x, decay);
          const earlyBloom = Math.exp(-x * 7.5);
          const diffuse = slowNoise * 0.78 + smoothNoise * 0.22;

          data[i] = diffuse * envelope * (0.72 + earlyBloom * 0.28);
        }
      }
      return impulse;
    }

    function ensureCloneChimeGraph() {
      if (!audioContext || cloneChimeReverb) return;

      cloneChimeReverb = audioContext.createConvolver();
      cloneChimeReverb.buffer = createChimeImpulse(
        audioContext,
        CLONE_CHIME_REVERB_SECONDS,
        2.85
      );

      const reverbFilter = audioContext.createBiquadFilter();
      reverbFilter.type = "lowpass";
      reverbFilter.frequency.value = 1650;
      reverbFilter.Q.value = 0.16;

      cloneChimeWetGain = audioContext.createGain();
      cloneChimeWetGain.gain.value = 0.56;

      cloneChimeDryGain = audioContext.createGain();
      cloneChimeDryGain.gain.value = 0.54;

      cloneChimeReverb.connect(reverbFilter);
      reverbFilter.connect(cloneChimeWetGain);
      cloneChimeWetGain.connect(audioContext.destination);
      cloneChimeDryGain.connect(audioContext.destination);
    }

    function playCloneChime() {
      if (!audioContext || audioContext.state !== "running") return;

      ensureCloneChimeGraph();
      if (!cloneChimeReverb || !cloneChimeWetGain || !cloneChimeDryGain) return;

      const now = audioContext.currentTime;
      audioClapIgnoreUntil = performance.now() + CLONE_CHIME_CLAP_GUARD_MS;

      const master = audioContext.createGain();
      const bodyFilter = audioContext.createBiquadFilter();
      const compressor = audioContext.createDynamicsCompressor();

      bodyFilter.type = "lowpass";
      bodyFilter.frequency.setValueAtTime(1550, now);
      bodyFilter.frequency.exponentialRampToValueAtTime(1120, now + 4.6);
      bodyFilter.Q.value = 0.14;

      compressor.threshold.value = -27;
      compressor.knee.value = 28;
      compressor.ratio.value = 1.55;
      compressor.attack.value = 0.055;
      compressor.release.value = 0.85;

      // 기존 '띵'의 짧은 어택을 없애고, 부팅음처럼 코드가 부드럽게 피어난다.
      master.gain.setValueAtTime(0.0001, now);
      master.gain.exponentialRampToValueAtTime(CLONE_CHIME_MASTER_GAIN, now + 0.085);
      master.gain.exponentialRampToValueAtTime(CLONE_CHIME_MASTER_GAIN * 0.70, now + 0.72);
      master.gain.exponentialRampToValueAtTime(CLONE_CHIME_MASTER_GAIN * 0.19, now + 2.65);
      master.gain.exponentialRampToValueAtTime(0.0001, now + 5.25);

      const chord = [
        { f: 110.00, gain: 0.29, attack: 0.060, decay: 4.75, detune: -2 },
        { f: 146.83, gain: 0.52, attack: 0.070, decay: 5.05, detune:  1 },
        { f: 185.00, gain: 0.28, attack: 0.085, decay: 4.65, detune: -1 },
        { f: 220.00, gain: 0.17, attack: 0.100, decay: 4.35, detune:  2 },
        { f: 293.66, gain: 0.055, attack: 0.120, decay: 3.80, detune: -2 }
      ];

      chord.forEach((tone) => {
        const osc = audioContext.createOscillator();
        const g = audioContext.createGain();

        osc.type = "sine";
        osc.frequency.setValueAtTime(tone.f, now);
        osc.detune.value = tone.detune;

        // 거의 알아차리지 못할 정도로만 아래로 착지.
        osc.frequency.exponentialRampToValueAtTime(tone.f * 0.997, now + 1.4);

        g.gain.setValueAtTime(0.0001, now);
        g.gain.exponentialRampToValueAtTime(tone.gain, now + tone.attack);
        g.gain.exponentialRampToValueAtTime(tone.gain * 0.62, now + 0.82);
        g.gain.exponentialRampToValueAtTime(0.0001, now + tone.decay);

        osc.connect(g);
        g.connect(master);
        osc.start(now);
        osc.stop(now + tone.decay + 0.10);
      });

      master.connect(bodyFilter);
      bodyFilter.connect(compressor);
      compressor.connect(cloneChimeDryGain);
      compressor.connect(cloneChimeReverb);

      setTimeout(() => {
        try { master.disconnect(); } catch (_) {}
        try { bodyFilter.disconnect(); } catch (_) {}
        try { compressor.disconnect(); } catch (_) {}
      }, 6500);
    }

    // ============================================================
    // 8. Clone Mode 상태 머신
    // ============================================================
    function enableCloneMode(nowMs) {
      if (cloneMode) return;
      cloneMode = true;
      pointStartTime = null;
      pointReleaseStartTime = null;
      bentHoldStartTime = null;
      flickArmed = true; // 포인팅 상태에서 들어오므로 즉시 까딱임 대기
      lastFlickTime = nowMs - FLICK_REARM_MS;

      // 포인팅 순간부터 구 크기를 일정하게 만들어 복제 형태를 선명하게 유지
      activeSphere.targetRadius = FOLLOWER_RADIUS;
      activeSphere.targetSpread = 0.07;

      modeEl.textContent = "CLONE MODE · 검지 굽힘 = FIX / 손바닥 펼침 = CLEAR";
      statusEl.textContent = "복제 모드 ON · 검지를 구부리면 현재 위치에 구체가 고정됩니다";
      statusEl.classList.remove("hide");
      setTimeout(() => statusEl.classList.add("hide"), 1800);
    }

    function spawnFollowerFrom(sourceSphere) {
      const follower = new ParticleSphere(sourceSphere.currentPos.clone(), 0.08);
      follower.currentRadius = 0.08;
      follower.targetRadius = 0.08;
      follower.currentSpread = 0.24;
      follower.targetSpread = 0.12;
      follower.material.opacity = 0.0;
      follower.life = 0.0;
      follower.targetLife = 0.0;
      follower.emerging = true;
      follower.locked = false;
      follower.lockPosition = null;
      follower.sourceSphere = sourceSphere;
      follower.targetQuaternion.copy(sourceSphere.points.quaternion);
      follower.points.quaternion.copy(sourceSphere.points.quaternion);

      const bridge = new ParticleBridge(sourceSphere, follower);
      bridges.push(bridge);
      activeSphere = follower;
      beginRotationReference();
    }

    function lockAndClone(nowMs) {
      if (!cloneMode || !activeSphere) return;

      // 새 follower가 거의 원본 위치에 겹쳐 있을 때 연속 오인식을 방지
      if (activeSphere.emerging && activeSphere.sourceSphere) {
        const d = activeSphere.currentPos.distanceTo(activeSphere.sourceSphere.currentPos);
        if (d < LOCK_MIN_DISTANCE) {
          statusEl.textContent = "손을 조금 이동한 뒤 다시 검지를 까딱해주세요";
          statusEl.classList.remove("hide");
          setTimeout(() => statusEl.classList.add("hide"), 900);
          return;
        }
      }

      activeSphere.locked = true;
      activeSphere.emerging = false;
      // 현재 보이는 위치를 별도 anchor로 저장한다.
      // 이후 activeSphere가 새 follower로 바뀌어도 이 구체는 절대 손을 따라가지 않는다.
      activeSphere.lockPosition = activeSphere.currentPos.clone();
      activeSphere.lockQuaternion.copy(activeSphere.points.quaternion);
      activeSphere.targetPos.copy(activeSphere.lockPosition);
      activeSphere.targetQuaternion.copy(activeSphere.lockQuaternion);
      activeSphere.targetRadius = FOLLOWER_RADIUS;
      activeSphere.targetSpread = 0.07;
      activeSphere.targetLife = 1;
      activeSphere.life = Math.max(activeSphere.life, 0.98);
      if (!lockedSpheres.includes(activeSphere)) lockedSpheres.push(activeSphere);

      // 첫 구체를 포함하여 최대 개수 제한
      if (lockedSpheres.length >= MAX_SPHERES) {
        statusEl.textContent = `최대 ${MAX_SPHERES}개까지 생성됩니다 · R 키로 초기화`;
        statusEl.classList.remove("hide");
        setTimeout(() => statusEl.classList.add("hide"), 1200);
        activeSphere = lockedSpheres[lockedSpheres.length - 1];
        return;
      }

      const justLocked = activeSphere;
      spawnFollowerFrom(justLocked);
      // 검지 까딱으로 구체 하나가 성공적으로 고정되고 다음 복제가 시작되는 순간 울림음 재생
      playCloneChime();
      lastFlickTime = nowMs;

      statusEl.textContent = `구체 ${lockedSpheres.length}개 고정 · 손을 옮긴 뒤 다시 까딱하세요`;
      statusEl.classList.remove("hide");
      setTimeout(() => statusEl.classList.add("hide"), 1000);
    }

    function exitCloneModeSoft() {
      if (!cloneMode) return;

      cloneMode = false;
      resetSplitState(true);
      pointStartTime = null;
      pointReleaseStartTime = null;
      bentHoldStartTime = null;
      flickArmed = false;
      modeEl.textContent = "NORMAL · 검지 포인팅으로 CLONE MODE";

      // base sphere 외 복제 구체는 자신이 태어난 이전 구체 쪽으로 수축하며 사라진다.
      const extras = new Set([...lockedSpheres, activeSphere]);
      extras.delete(baseSphere);
      extras.forEach((sphere) => {
        if (!sphere || sphere.dissolving) return;
        const collapseTarget = sphere.sourceSphere?.currentPos ?? baseSphere.currentPos;
        sphere.startDissolve(collapseTarget.clone());
        dissolvingSpheres.push(sphere);
      });

      // 브리지도 즉시 끊지 않고 같은 속도로 fade-out시켜 연결이 자연스럽게 풀린다.
      bridges.forEach((bridge) => {
        bridge.startDissolve();
        dissolvingBridges.push(bridge);
      });
      bridges.length = 0;
      lockedSpheres.length = 0;

      activeSphere = baseSphere;
      baseSphere.locked = false;
      baseSphere.lockPosition = null;
      baseSphere.emerging = false;
      baseSphere.sourceSphere = null;
      baseSphere.targetLife = 1;
      baseSphere.life = Math.max(baseSphere.life, 0.9);
      beginRotationReference();

      statusEl.textContent = "포인팅 종료 · 복제된 구체를 해체합니다";
      statusEl.classList.remove("hide");
      setTimeout(() => statusEl.classList.add("hide"), 900);
    }

    function resetScene() {
      cloneMode = false;
      resetFastChargeState();
      resetSplitState(true);
      pointStartTime = null;
      flickArmed = false;
      modeEl.textContent = "NORMAL · 검지 포인팅으로 CLONE MODE";

      // baseSphere 외 구체/브리지는 부드럽게 사라짐
      const allExtra = new Set([...lockedSpheres, activeSphere]);
      allExtra.delete(baseSphere);
      allExtra.forEach((s) => {
        if (s && !s.dissolving) {
          s.startDissolve(new THREE.Vector3(0, 0, 0));
          dissolvingSpheres.push(s);
        }
      });

      bridges.forEach((b) => b.dispose());
      bridges.length = 0;
      dissolvingBridges.forEach((b) => b.dispose());
      dissolvingBridges.length = 0;
      lockedSpheres.length = 0;

      activeSphere = baseSphere;
      baseSphere.locked = false;
      baseSphere.lockPosition = null;
      baseSphere.emerging = false;
      baseSphere.sourceSphere = null;
      baseSphere.targetPos.set(0, 0, 0);
      baseSphere.currentRadius = 0.24;
      baseSphere.targetRadius = 1.03;
      baseSphere.currentSpread = 0.85;
      baseSphere.targetSpread = 0.075;
      baseSphere.life = 1;
      baseSphere.targetLife = 1;
      baseSphere.material.opacity = currentSphereStyle.opacity;
      beginRotationReference();

      statusEl.textContent = "초기화 · 하나의 구체로 돌아왔습니다";
      statusEl.classList.remove("hide");
      setTimeout(() => statusEl.classList.add("hide"), 1200);
    }

    function processCloneGestures(gesture, nowMs) {
      if (!cloneMode) {
        if (gesture.pointing) {
          if (pointStartTime == null) pointStartTime = nowMs;
          if (nowMs - pointStartTime >= POINT_TRIGGER_MS) {
            enableCloneMode(nowMs);
          }
        } else {
          pointStartTime = null;
        }
        return;
      }

      // clone mode 종료는 오직 "손바닥을 확실히 펼친 상태"가 일정 시간 유지될 때만.
      // 검지를 굽혀 복제하는 중이나 손 추적이 잠깐 흔들릴 때는 절대 종료하지 않는다.
      if (gesture.openRelease) {
        if (pointReleaseStartTime == null) pointReleaseStartTime = nowMs;
        if (nowMs - pointReleaseStartTime >= POINT_RELEASE_MS) {
          exitCloneModeSoft();
          return;
        }
      } else {
        pointReleaseStartTime = null;
      }

      // 중지/약지/소지가 대부분 접힌 동안 검지 bend를 받는다.
      if (!gesture.othersFolded) return;

      const straightEnough =
        gesture.indexStraight >= FLICK_ARM_STRAIGHTNESS ||
        gesture.indexBendAngle >= FLICK_ARM_ANGLE_DEG;

      const bentEnough =
        gesture.indexStraight <= FLICK_BEND_STRAIGHTNESS ||
        gesture.indexBendAngle <= FLICK_BEND_ANGLE_DEG;

      // 검지를 다시 편 상태가 확인되면 다음 까딱임을 arm.
      if (!flickArmed) {
        if (straightEnough && nowMs - lastFlickTime >= FLICK_REARM_MS) {
          flickArmed = true;
          bentHoldStartTime = null;
        }
        return;
      }

      // arm된 상태에서 검지를 충분히 굽히면 즉시 FIX + 다음 follower 생성.
      if (bentEnough && nowMs - lastFlickTime >= FLICK_REARM_MS) {
        flickArmed = false;
        bentHoldStartTime = nowMs;
        lastFlickTime = nowMs;
        lockAndClone(nowMs);
      }
    }

    // ============================================================
    // 8. 박수 감지 / 전체 해체 ↔ 복원
    // ============================================================
    function clearCloneStateWhileBlack() {
      if (clapCleanupDone) return;
      clapCleanupDone = true;
      clapCleanupPending = false;

      // 화면이 완전히 검게 된 뒤 복제 구조를 정리한다.
      // 따라서 사라지는 순간까지는 현재 보이던 모든 구체와 브리지가 함께 해체된다.
      const extraSpheres = new Set([...lockedSpheres, activeSphere, ...dissolvingSpheres]);
      extraSpheres.delete(baseSphere);
      extraSpheres.forEach((sphere) => sphere?.dispose());

      bridges.forEach((bridge) => bridge.dispose());
      dissolvingBridges.forEach((bridge) => bridge.dispose());
      bridges.length = 0;
      dissolvingBridges.length = 0;
      dissolvingSpheres.length = 0;
      lockedSpheres.length = 0;

      cloneMode = false;
      resetSplitState(true);
      pointStartTime = null;
      pointReleaseStartTime = null;
      bentHoldStartTime = null;
      flickArmed = false;

      activeSphere = baseSphere;
      baseSphere.locked = false;
      baseSphere.lockPosition = null;
      baseSphere.emerging = false;
      baseSphere.sourceSphere = null;
      baseSphere.dissolving = false;
      baseSphere.life = 1;
      baseSphere.targetLife = 1;
      baseSphere.targetPos.set(0, 0, 0);
      baseSphere.targetRadius = 1.03;
      baseSphere.targetSpread = 0.075;
      baseSphere.targetQuaternion.identity();

      rotationReferenceReady = false;
      modeEl.textContent = "NORMAL · 검지 포인팅으로 CLONE MODE";
      resetFastChargeState();
    }

    function toggleClapState(nowMs) {
      if (nowMs - lastClapTime < CLAP_COOLDOWN_MS) return;
      lastClapTime = nowMs;

      if (!clapBlack) {
        // 첫 박수: 현재 보이는 모든 구체/연결부를 그대로 입자화한 뒤 사라지게 한다.
        resetFastChargeState();
        clapBlack = true;
        clapDissolveTarget = 1;
        clapCleanupPending = true;
        clapCleanupDone = false;
        modeEl.textContent = "CLAP · DISSOLVING";
        statusEl.textContent = "박수 감지 · 구체가 점으로 해체됩니다";
        statusEl.classList.remove("hide");
        playDissolveWhoosh();
        setAmbientTargetGain(AMBIENT_TRANSITION_GAIN * 0.6, 0.18);
        setTimeout(() => document.body.classList.add("clap-black"), 480);
      } else {
        // 두 번째 박수: 검은 화면 속 점들이 다시 모이면서 새로운 랜덤 구체로 복원된다.
        if (clapCleanupPending && !clapCleanupDone) {
          clearCloneStateWhileBlack();
        }
        const nextStyle = pickRandomSphereStyle(currentSphereStyle);
        setCurrentSphereStyle(nextStyle, {
          applyToBaseSphere: true,
          seedScattered: true
        });

        clapBlack = false;
        clapDissolveTarget = 0;
        document.body.classList.remove("clap-black");
        modeEl.textContent = `RESTORING · ${currentSphereStyle.name}`;
        statusEl.textContent = `박수 감지 · ${currentSphereStyle.name} 구체가 다시 모입니다`;
        statusEl.classList.remove("hide");
        playRestoreWhoosh();
        setAmbientTargetGain(AMBIENT_TRANSITION_GAIN * 0.75, 0.18);
        setTimeout(() => statusEl.classList.add("hide"), 1800);
      }
    }

    function updateAudioClapDetection(nowMs) {
      if (!microphoneReady || !audioAnalyser || !audioTimeData || !audioFreqData) return false;
      if (audioContext?.state === "suspended") return false;
      // 방금 재생한 복제 완료음의 잔향을 박수로 잘못 인식하지 않는다.
      if (nowMs < audioClapIgnoreUntil) {
        clapCandidateAt = -Infinity;
        clapCandidateRms = 0;
        return false;
      }

      audioAnalyser.getFloatTimeDomainData(audioTimeData);
      audioAnalyser.getByteFrequencyData(audioFreqData);

      let sumSq = 0;
      let peak = 0;
      for (let i = 0; i < audioTimeData.length; i++) {
        const v = audioTimeData[i];
        sumSq += v * v;
        peak = Math.max(peak, Math.abs(v));
      }
      const rms = Math.sqrt(sumSq / audioTimeData.length);
      const onset = rms - previousAudioRms;
      previousAudioRms = rms;
      const crest = peak / Math.max(0.0001, rms);

      // 박수는 보통 비교적 넓은 주파수 대역을 포함한다.
      const nyquist = audioContext.sampleRate * 0.5;
      const binHz = nyquist / audioFreqData.length;
      const highStart = Math.max(1, Math.floor(1800 / binHz));
      let allEnergy = 0;
      let highEnergy = 0;
      for (let i = 1; i < audioFreqData.length; i++) {
        const e = audioFreqData[i] / 255;
        const ee = e * e;
        allEnergy += ee;
        if (i >= highStart) highEnergy += ee;
      }
      const highRatio = highEnergy / Math.max(0.0001, allEnergy);

      // 큰 transient가 아닐 때만 주변 소음 기준치를 천천히 갱신한다.
      if (rms < Math.max(CLAP_MIN_RMS * 1.35, audioNoiseFloor * 2.1)) {
        audioNoiseFloor = lerp(audioNoiseFloor, rms, CLAP_NOISE_ADAPT);
      }

      const dynamicThreshold = Math.max(CLAP_MIN_RMS, audioNoiseFloor * CLAP_NOISE_MULTIPLIER);
      const clapOnsetLike =
        rms >= dynamicThreshold &&
        peak >= CLAP_MIN_PEAK &&
        onset >= CLAP_MIN_ONSET &&
        crest >= CLAP_MIN_CREST &&
        highRatio >= CLAP_MIN_HIGH_RATIO &&
        nowMs - lastClapTime >= CLAP_COOLDOWN_MS;

      // 1) 강한 onset을 후보로 저장
      if (clapOnsetLike && !Number.isFinite(clapCandidateAt)) {
        clapCandidateAt = nowMs;
        clapCandidateRms = rms;
        return false;
      }

      // 2) 실제 박수라면 30~200ms 안에 음량이 빠르게 꺼진다.
      //    말소리/음악/문 닫힘처럼 길게 이어지는 소리는 여기서 걸러진다.
      if (Number.isFinite(clapCandidateAt)) {
        const age = nowMs - clapCandidateAt;
        const decayFloor = Math.max(audioNoiseFloor * 2.4, clapCandidateRms * CLAP_DECAY_RATIO);

        if (age >= CLAP_CONFIRM_MIN_MS && age <= CLAP_CONFIRM_MAX_MS && rms <= decayFloor) {
          clapCandidateAt = -Infinity;
          clapCandidateRms = 0;
          toggleClapState(nowMs);
          micStatusEl.textContent = "MIC · CLAP";
          setTimeout(() => {
            if (microphoneReady) micStatusEl.textContent = "MIC · LISTENING";
          }, 500);
          return true;
        }

        if (age > CLAP_CONFIRM_MAX_MS) {
          clapCandidateAt = -Infinity;
          clapCandidateRms = 0;
        }
      }
      return false;
    }

    async function startMicrophone(audioStream) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) throw new Error("이 브라우저는 Web Audio API를 지원하지 않습니다.");

      microphoneStream = audioStream;
      audioContext = new AudioCtx();
      audioAnalyser = audioContext.createAnalyser();
      audioAnalyser.fftSize = 1024;
      audioAnalyser.smoothingTimeConstant = 0.05;
      audioAnalyser.minDecibels = -90;
      audioAnalyser.maxDecibels = -10;

      microphoneSource = audioContext.createMediaStreamSource(audioStream);
      microphoneSource.connect(audioAnalyser);
      audioTimeData = new Float32Array(audioAnalyser.fftSize);
      audioFreqData = new Uint8Array(audioAnalyser.frequencyBinCount);
      ensureCloneChimeGraph();
      ensureMainReverbGraph();
      ensureAmbientGraph();
      ensureFastChargeGraph();

      // Chrome/Safari의 autoplay 정책 때문에 처음에는 suspended일 수 있다.
      // 첫 클릭/터치에서 자동으로 resume한다.
      const resumeAudio = async () => {
        if (audioContext?.state === "suspended") {
          try { await audioContext.resume(); } catch (_) {}
        }
        if (audioContext?.state === "running") {
          microphoneReady = true;
          micStatusEl.textContent = "MIC · LISTENING";
          startAmbientBed();
          setAmbientTargetGain(clapBlack ? AMBIENT_BLACK_GAIN : AMBIENT_MASTER_GAIN, 1.1);
          window.removeEventListener("pointerdown", resumeAudio);
          window.removeEventListener("keydown", resumeAudio);
        }
      };

      await resumeAudio();
      if (audioContext.state !== "running") {
        micStatusEl.textContent = "MIC · 화면을 한 번 클릭";
        window.addEventListener("pointerdown", resumeAudio);
        window.addEventListener("keydown", resumeAudio);
      } else {
        microphoneReady = true;
        micStatusEl.textContent = "MIC · LISTENING";
        startAmbientBed();
        setAmbientTargetGain(clapBlack ? AMBIENT_BLACK_GAIN : AMBIENT_MASTER_GAIN, 1.1);
      }
    }

    // ============================================================
    // 9. MediaPipe
    // ============================================================
    let handLandmarker = null;
    let lastDetectAt = -Infinity;
    let lastVideoTime = -1;
    let lastOpenness = 0.55;

    async function createHandLandmarker() {
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
      );

      const options = {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numHands: 2,
        minHandDetectionConfidence: 0.55,
        minHandPresenceConfidence: 0.50,
        minTrackingConfidence: 0.55
      };

      try {
        return await HandLandmarker.createFromOptions(vision, options);
      } catch (gpuError) {
        console.warn("GPU delegate failed. Falling back to CPU.", gpuError);
        options.baseOptions.delegate = "CPU";
        return await HandLandmarker.createFromOptions(vision, options);
      }
    }

    async function startCameraAndMicrophone() {
      if (!navigator.mediaDevices?.getUserMedia) {
        throw new Error("이 브라우저는 카메라/마이크 API를 지원하지 않습니다.");
      }

      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "user",
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: {
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: false
        }
      });

      const videoTracks = stream.getVideoTracks();
      const audioTracks = stream.getAudioTracks();

      const videoOnlyStream = new MediaStream(videoTracks);
      video.srcObject = videoOnlyStream;
      await video.play();

      if (audioTracks.length) {
        const audioOnlyStream = new MediaStream(audioTracks);
        await startMicrophone(audioOnlyStream);
      } else {
        micStatusEl.textContent = "MIC · 권한 필요";
      }
    }

    async function initHandTracking() {
      statusEl.textContent = "카메라와 마이크 권한을 허용해주세요";
      await startCameraAndMicrophone();
      statusEl.textContent = "손 인식 모델을 준비하는 중...";
      handLandmarker = await createHandLandmarker();
      statusEl.textContent = `${currentSphereStyle.name} · 포인팅 = 복제 · 양손 pinch = split · 박수 = 해체/복원`;
    }

    function processPrimaryHandAnalysis(analysis, nowMs, suppressCloneGestures = false) {
      lastOpenness = analysis.openness;

      handTarget.copy(analysis.palmScene);
      updateFastChargeFromMotion(handTarget.x, nowMs);

      // 손바닥 3D 방향 — 손 모양과 상관없이 회전 추적
      const rawHandQuaternion = getHandOrientationQuaternion(analysis.lm);
      if (rawHandQuaternion) {
        if (!hasHandOrientation) {
          smoothedHandQuaternion.copy(rawHandQuaternion);
          hasHandOrientation = true;
          beginRotationReference();
        } else {
          smoothedHandQuaternion.slerp(rawHandQuaternion, 0.30);
        }
      }

      if (suppressCloneGestures) {
        pointStartTime = null;
      } else {
        processCloneGestures(analysis.gesture, nowMs);
      }
      updateActiveSphereRotation();

      if (!firstHandSeen) {
        firstHandSeen = true;
        statusEl.classList.add("hide");
      }
    }

    function updateHandTracking(nowMs) {
      if (!handLandmarker || video.readyState < 2) return;
      if (nowMs - lastDetectAt < DETECTION_INTERVAL_MS) return;
      if (video.currentTime === lastVideoTime) return;

      lastDetectAt = nowMs;
      lastVideoTime = video.currentTime;

      const result = handLandmarker.detectForVideo(video, nowMs);
      const hands = result.landmarks ?? [];
      const handednesses = result.handednesses ?? [];
      const analyses = hands.map((lm, idx) => analyzeHand(
        lm,
        handednesses[idx]?.[0]?.displayName || handednesses[idx]?.[0]?.categoryName || ""
      ));
      handSeen = analyses.length > 0;

      // 완전 해체 상태/전환 중에는 박수 감지만 유지하고 다른 인터랙션은 잠근다.
      const clapTransitionActive = clapDissolve > 0.035 || clapDissolveTarget > 0.5;
      const splitHandled = !clapTransitionActive && updateTwoHandSplitInteraction(analyses, nowMs, clapTransitionActive);
      const suppressCloneGestures = analyses.length >= 2;

      if (analyses.length && !clapTransitionActive) {
        lastHandSeenAt = nowMs;
        if (splitHandled) {
          pointStartTime = null;
          hasHandOrientation = false;
          rotationReferenceReady = false;
        } else {
          const primary = analyses[0];
          processPrimaryHandAnalysis(primary, nowMs, suppressCloneGestures);
        }
      } else if (!analyses.length) {
        pointStartTime = null;
        hasHandOrientation = false;
        rotationReferenceReady = false;
        if (!clapTransitionActive) resetSplitState(false);
        if (!clapTransitionActive && cloneMode && nowMs - lastHandSeenAt >= HAND_LOST_EXIT_MS) {
          exitCloneModeSoft();
        }
      }
    }

    // ============================================================
    // 10. 애니메이션
    // ============================================================
    function updateScene(t) {
      updateAmbientState();
      // 박수 해체/복원 전역 진행도
      const clapEase = clapDissolveTarget > clapDissolve
        ? CLAP_DISSOLVE_EASE
        : CLAP_RESTORE_EASE;
      clapDissolve = lerp(clapDissolve, clapDissolveTarget, clapEase);
      if (Math.abs(clapDissolve - clapDissolveTarget) < 0.0008) {
        clapDissolve = clapDissolveTarget;
      }

      // 완전히 검게 된 순간에만 복제 상태를 정리한다.
      if (clapCleanupPending && clapDissolve > 0.985) {
        clearCloneStateWhileBlack();
      }

      const clapInteractionLocked = clapDissolve > 0.035 || clapDissolveTarget > 0.5;
      const splitInteractionActive = splitMode || splitReturning;
      const interactionLockedForCharge = clapInteractionLocked || splitInteractionActive;
      updateFastChargeState(frameDeltaSec, handSeen, interactionLockedForCharge);
      updateFastChargeAudio();

      if (handSeen && !clapInteractionLocked && !splitInteractionActive) {
        // MediaPipe는 약 25fps로 갱신되므로 렌더 프레임에서 지수 보간해 계단감을 없앤다.
        smoothedHandTarget.lerp(handTarget, expEase(8.5, frameDeltaSec));
      }

      if (!clapInteractionLocked && splitInteractionActive) {
        // tracking 결과는 target만 갱신하고, 실제 split 애니메이션은 렌더 프레임에서 부드럽게 보간한다.
        const splitRate = splitReturning ? SPLIT_RETURN_SPEED : 7.6;
        splitAmount = lerp(splitAmount, splitAmountTarget, expEase(splitRate, frameDeltaSec));

        const mainSphere = activeSphere || baseSphere;
        mainSphere.targetPos.copy(splitMidpoint);
        mainSphere.targetRadius = splitSourceRadius * lerp(1.0, 0.82, splitAmount);
        mainSphere.targetSpread = splitSourceSpread * lerp(1.0, 0.75, splitAmount);
        // 중앙에 작은 점이 남지 않도록 radius를 극단적으로 줄이지 않고, 두 자식 구체가 생기면서 원본만 fade한다.
        mainSphere.targetLife = 1 - smootherstep(0.08, 0.42, splitAmount);

        if (leftSplitSphere && rightSplitSphere) {
          const childLife = smootherstep(0.03, 0.30, splitAmount);
          const childRadius = splitSourceRadius * lerp(0.56, 0.46, splitAmount);
          const childSpread = splitSourceSpread * lerp(1.05, 0.68, splitAmount);
          const offset = lerp(splitSourceRadius * 0.05, SPLIT_MAX_OFFSET, splitAmount);

          splitLeftTarget.copy(splitMidpoint).addScaledVector(splitAxis, -offset);
          splitRightTarget.copy(splitMidpoint).addScaledVector(splitAxis, offset);

          leftSplitSphere.targetPos.copy(splitLeftTarget);
          rightSplitSphere.targetPos.copy(splitRightTarget);
          [leftSplitSphere, rightSplitSphere].forEach((sphere) => {
            sphere.targetRadius = childRadius;
            sphere.targetSpread = childSpread;
            sphere.targetLife = childLife;
            sphere.targetQuaternion.copy(mainSphere.targetQuaternion);
          });
        }

        if (splitReturning && splitAmount < 0.018) {
          finishSplitReturn();
        }
      } else if (!clapInteractionLocked && !cloneMode) {
        // 기존 인터랙션: 한 개 구체가 손 위치/펼침 정도를 따름
        activeSphere.targetLife = 1;
        if (handSeen) {
          activeSphere.targetPos.copy(smoothedHandTarget);
          activeSphere.targetRadius = lerp(0.34, 1.42, lastOpenness) * lerp(1, FAST_CHARGE_SHRINK, fastChargeLevel);
          activeSphere.targetSpread = lerp(0.018, 0.24, lastOpenness) * lerp(1, FAST_CHARGE_DENSITY_SCALE, fastChargeLevel);
        } else {
          activeSphere.targetPos.lerp(new THREE.Vector3(0, 0, 0), 0.03);
          activeSphere.targetRadius = 1.02;
          activeSphere.targetSpread = 0.07;
        }
      } else if (!clapInteractionLocked) {
        // 복제 모드: 현재 active sphere만 손을 따라감.
        // locked sphere는 해당 위치에 고정.
        if (activeSphere && !activeSphere.locked && handSeen) {
          activeSphere.targetPos.copy(smoothedHandTarget);

          if (activeSphere.emerging && activeSphere.sourceSphere) {
            const d = activeSphere.sourceSphere.currentPos.distanceTo(smoothedHandTarget);
            const emergence = smootherstep(0.035, FOLLOWER_FULL_DISTANCE, d);
            activeSphere.targetRadius = lerp(0.05, FOLLOWER_RADIUS, emergence) * lerp(1, FAST_CHARGE_SHRINK, fastChargeLevel);
            activeSphere.targetSpread = lerp(0.28, 0.07, emergence) * lerp(1, FAST_CHARGE_DENSITY_SCALE, fastChargeLevel);
            activeSphere.targetLife = emergence;
          } else {
            activeSphere.targetRadius = FOLLOWER_RADIUS * lerp(1, FAST_CHARGE_SHRINK, fastChargeLevel);
            activeSphere.targetSpread = 0.07 * lerp(1, FAST_CHARGE_DENSITY_SCALE, fastChargeLevel);
          }
        }
      }

      // 모든 구체 업데이트 — Set을 매 프레임 새로 만들지 않고 재사용해 GC spike를 줄인다.
      sphereUpdateSet.clear();
      sphereUpdateSet.add(baseSphere);
      lockedSpheres.forEach((sphere) => sphereUpdateSet.add(sphere));
      if (activeSphere) sphereUpdateSet.add(activeSphere);
      if (leftSplitSphere) sphereUpdateSet.add(leftSplitSphere);
      if (rightSplitSphere) sphereUpdateSet.add(rightSplitSphere);
      dissolvingSpheres.forEach((sphere) => sphereUpdateSet.add(sphere));
      sphereUpdateSet.forEach((sphere) => sphere?.update(t));
      updateCoreGlow(t, clapInteractionLocked);

      bridges.forEach((bridge) => bridge.update(t));
      dissolvingBridges.forEach((bridge) => bridge.update(t));

      // 사라진 브리지 메모리 정리
      for (let i = dissolvingBridges.length - 1; i >= 0; i--) {
        const bridge = dissolvingBridges[i];
        if (bridge.life < 0.025 && bridge.material.opacity < 0.025) {
          bridge.dispose();
          dissolvingBridges.splice(i, 1);
        }
      }

      // 사라진 구체 메모리 정리
      for (let i = dissolvingSpheres.length - 1; i >= 0; i--) {
        const s = dissolvingSpheres[i];
        if (s.life < 0.025) {
          s.dispose();
          dissolvingSpheres.splice(i, 1);
        }
      }

      if (!splitMode && !splitReturning) {
        if (leftSplitSphere && leftSplitSphere.life < 0.04) { leftSplitSphere.dispose(); leftSplitSphere = null; }
        if (rightSplitSphere && rightSplitSphere.life < 0.04) { rightSplitSphere.dispose(); rightSplitSphere = null; }
      }

      if (!clapBlack && clapDissolveTarget === 0 && clapDissolve < 0.025) {
        if (splitReturning) {
          modeEl.textContent = "SPLIT · MERGING";
        } else if (splitMode) {
          modeEl.textContent = "SPLIT MODE · pinch 유지 + 좌우로 늘리기";
        } else if (fastChargeMode && cloneMode) {
          modeEl.textContent = "CLONE MODE · FAST CHARGE";
        } else if (fastChargeMode) {
          modeEl.textContent = "FAST CHARGE · 좌우 흔들기 감지";
        } else if (cloneMode) {
          modeEl.textContent = "CLONE MODE · 까딱 = FIX / 손바닥 펼침 = CLEAR";
        } else {
          modeEl.textContent = "NORMAL · 검지 포인팅으로 CLONE MODE";
        }
      }
    }

    let lastAnimateNowMs = performance.now();
    function animate(nowMs = performance.now()) {
      requestAnimationFrame(animate);
      frameDeltaSec = Math.min(0.05, Math.max(0.001, (nowMs - lastAnimateNowMs) / 1000));
      lastAnimateNowMs = nowMs;
      particleUpdatePhase++;
      updateAdaptiveQuality(nowMs);
      updateAudioClapDetection(nowMs);
      updateHandTracking(nowMs);
      updateScene(clock.getElapsedTime());
      renderer.render(scene, camera);
    }

    // ============================================================
    // 11. 리사이즈 / 디버그 / 초기화
    // ============================================================
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      applyAdaptiveQuality(adaptiveQualityLevel);
    });

    window.addEventListener("keydown", (e) => {
      const key = e.key.toLowerCase();
      if (key === "d") video.classList.toggle("debug");
      if (key === "r") resetScene();
      // N 키: 박수 없이도 다음 랜덤 구체를 빠르게 테스트한다.
      if (key === "n") {
        const nextStyle = pickRandomSphereStyle(currentSphereStyle);
        setCurrentSphereStyle(nextStyle, { applyToBaseSphere: true, seedScattered: false });
        resetScene();
      }
      // S 키는 복제 완료음만 테스트하기 위한 디버그용 수동 트리거
      if (key === "s") playCloneChime();
      // X / V 키는 박수 해체/복원 사운드만 테스트하기 위한 디버그용 수동 트리거
      if (key === "x") playDissolveWhoosh();
      if (key === "v") playRestoreWhoosh();
      // C 키는 박수 전환을 테스트하기 위한 디버그용 수동 트리거
      if (key === "c") toggleClapState(performance.now());
    });

    applyAdaptiveQuality(0);
    animate();

    initHandTracking().catch((err) => {
      console.error(err);
      statusEl.classList.remove("hide");
      statusEl.textContent =
        "카메라/마이크를 시작하지 못했습니다. VSCode Live Server(localhost)에서 열고 카메라와 마이크 권한을 확인해주세요.";
    });
  </script>
</body>
</html>
