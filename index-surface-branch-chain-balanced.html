<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hand Particle Sphere · Stable Clone Chain + Audio Clap Dissolve</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000;
    }
    body {
      font-family: Inter, Pretendard, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #stage { position: fixed; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; }

    #status {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      color: rgba(255,255,255,.70);
      font-size: 12px;
      letter-spacing: .055em;
      white-space: nowrap;
      pointer-events: none;
      transition: opacity .35s ease;
    }
    #status.hide { opacity: 0; }

    #mode {
      position: fixed;
      left: 20px;
      top: 20px;
      padding: 9px 12px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 999px;
      color: rgba(255,255,255,.70);
      background: rgba(255,255,255,.045);
      backdrop-filter: blur(10px);
      font-size: 11px;
      letter-spacing: .07em;
      pointer-events: none;
      opacity: .85;
      transition: opacity .55s ease;
    }

    #mic-status {
      position: fixed;
      right: 20px;
      top: 20px;
      padding: 9px 12px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 999px;
      color: rgba(255,255,255,.62);
      background: rgba(255,255,255,.045);
      backdrop-filter: blur(10px);
      font-size: 11px;
      letter-spacing: .065em;
      pointer-events: none;
      opacity: .85;
      transition: opacity .55s ease;
    }

    #webcam {
      position: fixed;
      right: 18px;
      bottom: 18px;
      width: min(26vw, 220px);
      aspect-ratio: 16 / 9;
      object-fit: cover;
      transform: scaleX(-1);
      border-radius: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease;
      border: 1px solid rgba(255,255,255,.12);
    }
    #webcam.debug { opacity: .34; }

    /* 박수로 완전히 사라진 뒤에는 UI까지 사라져 검은 화면만 남긴다. */
    body.clap-black #mode,
    body.clap-black #status,
    body.clap-black #mic-status {
      opacity: 0 !important;
    }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="mode">NORMAL · 검지 포인팅으로 CLONE MODE</div>
  <div id="status">카메라와 손 인식 모델을 불러오는 중...</div>
  <div id="mic-status">MIC · 준비 중</div>
  <video id="webcam" autoplay muted playsinline></video>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js";
    import {
      HandLandmarker,
      FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs";

    // ============================================================
    // 1. 튜닝 값
    // ============================================================
    const PARTICLE_COUNT = 2700;
    const CONNECTOR_COUNT = 1800;
    const MAX_SPHERES = 9;
    const DETECTION_INTERVAL_MS = 40; // 약 25fps 손 추적

    // 기존 손 펼침 정도에 따른 구 크기
    const OPENNESS_MIN = 0.86;
    const OPENNESS_MAX = 1.58;

    // 포인팅이 이 시간 이상 안정적으로 유지되면 clone mode 활성화
    const POINT_TRIGGER_MS = 240;

    // 검지 까딱임(flick) 판정.
    // straightness = MCP↔TIP 직선거리 / 관절을 따라간 총 길이
    // 1에 가까울수록 검지가 곧게 펴져 있음.
    const FLICK_ARM_STRAIGHTNESS = 0.92;
    const FLICK_BEND_STRAIGHTNESS = 0.80;
    const FLICK_REARM_MS = 220;

    // 복제 구체가 원본에서 빠져나오는 느낌
    const FOLLOWER_FULL_DISTANCE = 1.35;
    const FOLLOWER_RADIUS = 0.92;
    const LOCK_MIN_DISTANCE = 0.22;

    // 포인팅을 실제로 해제했을 때 clone mode 종료.
    // flick 중 검지가 잠깐 접히는 동작은 종료로 보지 않도록 별도 grace time을 둔다.
    const POINT_RELEASE_MS = 480;
    const FLICK_HOLD_EXIT_MS = 980;
    const HAND_LOST_EXIT_MS = 850;

    // 손 회전 감도 — 손을 펴든 쥐든 계속 동작
    const ROTATION_GAIN_X = 0.95;
    const ROTATION_GAIN_Y = 0.95;
    const ROTATION_GAIN_Z = 1.45;
    const MAX_ROTATION_DELTA = Math.PI * 0.78;

    // 박수(clap) 판정 — 손 모양이 아니라 마이크의 짧고 강한 broadband impulse를 감지한다.
    // 주변 소음에 맞춰 noise floor를 자동 추적하고, 큰 소리 + 빠른 onset + 고주파 성분을 함께 본다.
    const CLAP_COOLDOWN_MS = 900;
    const CLAP_MIN_RMS = 0.075;          // 절대 최소 음량
    const CLAP_NOISE_MULTIPLIER = 4.2;   // 평소 주변소음 대비 몇 배 큰지
    const CLAP_MIN_PEAK = 0.34;          // 순간 peak
    const CLAP_MIN_ONSET = 0.030;        // 직전 frame 대비 갑작스러운 상승량
    const CLAP_MIN_CREST = 2.25;         // peak / RMS — 짧고 날카로운 소리 필터
    const CLAP_MIN_HIGH_RATIO = 0.20;    // 1.8kHz 이상 에너지 비율
    const CLAP_NOISE_ADAPT = 0.018;      // noise floor 적응 속도

    // 박수 해체/복원 속도. 값이 작을수록 더 천천히 진행된다.
    const CLAP_DISSOLVE_EASE = 0.026;
    const CLAP_RESTORE_EASE = 0.024;
    const CLAP_SCATTER_DISTANCE = 2.35;

    const stage = document.querySelector("#stage");
    const video = document.querySelector("#webcam");
    const statusEl = document.querySelector("#status");
    const modeEl = document.querySelector("#mode");
    const micStatusEl = document.querySelector("#mic-status");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    const camera = new THREE.PerspectiveCamera(
      42,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(0, 0, 6.4);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    stage.appendChild(renderer.domElement);

    const clock = new THREE.Clock();

    // ============================================================
    // 2. 유틸
    // ============================================================
    const clamp01 = (v) => Math.min(1, Math.max(0, v));
    const lerp = (a, b, t) => a + (b - a) * t;
    const map01 = (v, min, max) => clamp01((v - min) / (max - min));
    const smoothstep = (a, b, x) => {
      const t = clamp01((x - a) / (b - a));
      return t * t * (3 - 2 * t);
    };
    const smootherstep = (a, b, x) => {
      const t = clamp01((x - a) / (b - a));
      return t * t * t * (t * (t * 6 - 15) + 10);
    };
    const dist3 = (a, b) => Math.hypot(
      a.x - b.x,
      a.y - b.y,
      (a.z ?? 0) - (b.z ?? 0)
    );

    function makeParticleTexture() {
      const c = document.createElement("canvas");
      c.width = c.height = 64;
      const ctx = c.getContext("2d");
      const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      g.addColorStop(0.00, "rgba(255,255,255,1)");
      g.addColorStop(0.18, "rgba(255,255,255,.95)");
      g.addColorStop(0.48, "rgba(255,255,255,.25)");
      g.addColorStop(1.00, "rgba(255,255,255,0)");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(c);
    }

    const particleTexture = makeParticleTexture();

    // ============================================================
    // 박수 전역 비주얼 상태
    // 0 = 정상 구체 / 1 = 완전히 해체되어 검은 화면
    // ============================================================
    let clapDissolve = 0;
    let clapDissolveTarget = 0;
    let clapBlack = false;
    let clapCleanupPending = false;
    let clapCleanupDone = false;

    // ============================================================
    // 3. 구체용 공통 파티클 데이터
    // ============================================================
    const sphereBase = new Float32Array(PARTICLE_COUNT * 3);
    const sphereFlow = new Float32Array(PARTICLE_COUNT * 3);
    const spherePhase = new Float32Array(PARTICLE_COUNT);

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const z = 1 - 2 * Math.random();
      const theta = Math.random() * Math.PI * 2;
      const rXY = Math.sqrt(1 - z * z);
      const shell = 0.90 + Math.random() * 0.14;

      const j = i * 3;
      sphereBase[j] = Math.cos(theta) * rXY * shell;
      sphereBase[j + 1] = Math.sin(theta) * rXY * shell;
      sphereBase[j + 2] = z * shell;

      let fx = Math.random() * 2 - 1;
      let fy = Math.random() * 2 - 1;
      let fz = Math.random() * 2 - 1;
      const fl = Math.hypot(fx, fy, fz) || 1;
      sphereFlow[j] = fx / fl;
      sphereFlow[j + 1] = fy / fl;
      sphereFlow[j + 2] = fz / fl;
      spherePhase[i] = Math.random() * Math.PI * 2;
    }

    class ParticleSphere {
      constructor(position = new THREE.Vector3(), radius = 1.02) {
        this.geometry = new THREE.BufferGeometry();
        this.positions = new Float32Array(PARTICLE_COUNT * 3);
        this.positions.set(sphereBase);
        this.positionAttribute = new THREE.BufferAttribute(this.positions, 3);
        this.positionAttribute.setUsage(THREE.DynamicDrawUsage);
        this.geometry.setAttribute("position", this.positionAttribute);

        this.material = new THREE.PointsMaterial({
          color: 0xffffff,
          size: 0.040,
          map: particleTexture,
          transparent: true,
          opacity: 0.93,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
          sizeAttenuation: true,
          alphaTest: 0.02
        });

        this.points = new THREE.Points(this.geometry, this.material);
        this.currentPos = position.clone();
        this.targetPos = position.clone();
        this.points.position.copy(position);

        this.currentRadius = radius;
        this.targetRadius = radius;
        this.currentSpread = 0.075;
        this.targetSpread = 0.075;
        this.phaseOffset = Math.random() * Math.PI * 2;
        this.targetQuaternion = new THREE.Quaternion();
        this.locked = false;
        // 잠긴 구체는 손 추적/후속 follower 생성과 무관하게 정확히 같은 위치에 남는다.
        this.lockPosition = null;
        this.lockQuaternion = new THREE.Quaternion();
        this.emerging = false;
        this.sourceSphere = null;
        this.life = 1;
        this.targetLife = 1;
        this.dissolving = false;

        scene.add(this.points);
      }

      startDissolve(target = new THREE.Vector3()) {
        this.dissolving = true;
        this.targetPos.copy(target);
        this.targetRadius = 0.12;
        this.targetSpread = 1.15;
      }

      dispose() {
        scene.remove(this.points);
        this.geometry.dispose();
        this.material.dispose();
      }

      update(t) {
        if (this.locked && this.lockPosition) {
          this.targetPos.copy(this.lockPosition);
          this.targetQuaternion.copy(this.lockQuaternion);
          this.targetLife = 1;
          this.targetRadius = FOLLOWER_RADIUS;
          this.targetSpread = 0.07;
        }

        const posEase = this.locked ? 0.30 : 0.13;
        this.currentPos.lerp(this.targetPos, posEase);
        this.currentRadius = lerp(this.currentRadius, this.targetRadius, this.dissolving ? 0.09 : 0.10);
        this.currentSpread = lerp(this.currentSpread, this.targetSpread, this.dissolving ? 0.10 : 0.07);

        this.points.position.copy(this.currentPos);
        this.points.quaternion.slerp(this.targetQuaternion, 0.16);

        if (this.dissolving) {
          this.targetLife = 0;
          this.life = lerp(this.life, this.targetLife, 0.065);
        } else {
          this.life = lerp(this.life, this.targetLife, 0.12);
        }
        // 박수 해체 중에는 먼저 점들이 바깥으로 퍼지고, 후반부에 서서히 빛이 사라진다.
        const clapFade = 1 - smootherstep(0.34, 0.985, clapDissolve);
        this.material.opacity = this.life * 0.93 * clapFade;

        const breath = 1 + Math.sin(t * 1.20 + this.phaseOffset) * 0.022;
        const p = this.positions;

        for (let i = 0; i < PARTICLE_COUNT; i++) {
          const j = i * 3;
          const ph = spherePhase[i] + this.phaseOffset;
          const waveA = Math.sin(t * 1.62 + ph);
          const waveB = Math.sin(t * 0.83 + ph * 1.73);
          const localRadius = this.currentRadius * breath * (1 + waveB * 0.018);
          const flow = this.currentSpread * (0.45 + 0.55 * waveA);

          let tx = sphereBase[j] * localRadius + sphereFlow[j] * flow;
          let ty = sphereBase[j + 1] * localRadius + sphereFlow[j + 1] * flow;
          let tz = sphereBase[j + 2] * localRadius + sphereFlow[j + 2] * flow;

          if (this.dissolving) {
            tx += sphereFlow[j] * 0.72;
            ty += sphereFlow[j + 1] * 0.72;
            tz += sphereFlow[j + 2] * 0.72;
          }

          // 박수 해체: 구 표면이 팽창하면서 각 파티클이 고유 방향으로 흩어진다.
          // clapDissolve가 다시 0으로 가면 동일 경로를 역으로 따라 구체로 재조립된다.
          const scatter = smootherstep(0.0, 1.0, clapDissolve);
          const swirl = Math.sin(t * 0.55 + ph) * 0.13 * scatter;
          tx += sphereBase[j] * (0.55 * scatter);
          ty += sphereBase[j + 1] * (0.55 * scatter);
          tz += sphereBase[j + 2] * (0.55 * scatter);
          tx += sphereFlow[j] * CLAP_SCATTER_DISTANCE * scatter + sphereFlow[j + 1] * swirl;
          ty += sphereFlow[j + 1] * CLAP_SCATTER_DISTANCE * scatter - sphereFlow[j] * swirl;
          tz += sphereFlow[j + 2] * CLAP_SCATTER_DISTANCE * scatter;

          p[j] += (tx - p[j]) * 0.078;
          p[j + 1] += (ty - p[j + 1]) * 0.078;
          p[j + 2] += (tz - p[j + 2]) * 0.078;
        }

        this.positionAttribute.needsUpdate = true;
        this.material.size = lerp(0.048, 0.035, map01(this.currentRadius, 0.18, 1.15));
      }
    }

    // ============================================================
    // 4. 두 구체 사이의 유기적인 목/브리지
    //    첨부 레퍼런스처럼 양 끝은 넓고 중앙은 좁은 입자 연결부
    // ============================================================
    class ParticleBridge {
      constructor(aSphere, bSphere) {
        this.aSphere = aSphere;
        this.bSphere = bSphere;
        this.geometry = new THREE.BufferGeometry();
        this.positions = new Float32Array(CONNECTOR_COUNT * 3);
        this.colors = new Float32Array(CONNECTOR_COUNT * 3);
        this.u = new Float32Array(CONNECTOR_COUNT);
        this.angle = new Float32Array(CONNECTOR_COUNT);
        this.radial = new Float32Array(CONNECTOR_COUNT);
        this.phase = new Float32Array(CONNECTOR_COUNT);

        for (let i = 0; i < CONNECTOR_COUNT; i++) {
          this.u[i] = Math.random();
          this.angle[i] = Math.random() * Math.PI * 2;
          // 대부분은 연결부의 표면에, 일부는 안쪽에 배치해 단순한 "튜브"가 아니라
          // 두 구체가 실제로 분열하며 이어지는 밀도감을 만든다.
          // 구체와 같은 "얇은 shell"처럼 보이도록 대부분의 브리지 점도
          // 표면 쪽에 배치한다. 내부 점이 많으면 AdditiveBlending 때문에
          // 연결부만 하얗게 뭉쳐 보여서 별도 물질처럼 느껴진다.
          this.radial[i] = Math.random() < 0.93
            ? 0.88 + Math.random() * 0.12
            : Math.sqrt(Math.random()) * 0.72;
          this.phase[i] = Math.random() * Math.PI * 2;
          const j = i * 3;

          // 양 끝은 구체 파티클과 겹치는 영역이라 밝기가 두 배로 쌓이기 쉽다.
          // vertex color를 살짝 낮춰 "브리지 끝의 하얀 테두리"가 생기지 않게 한다.
          const edge = Math.abs(this.u[i] * 2 - 1);
          const seamDim = lerp(1.0, 0.52, smootherstep(0.62, 1.0, edge));
          this.colors[j] = seamDim;
          this.colors[j + 1] = seamDim;
          this.colors[j + 2] = seamDim;

          // 생성 첫 프레임부터 source→follower 사이에 고르게 배치해
          // 연결부가 한 점에서 갑자기 튀어나오는 느낌을 줄인다.
          this.positions[j] = lerp(aSphere.currentPos.x, bSphere.currentPos.x, this.u[i]);
          this.positions[j + 1] = lerp(aSphere.currentPos.y, bSphere.currentPos.y, this.u[i]);
          this.positions[j + 2] = lerp(aSphere.currentPos.z, bSphere.currentPos.z, this.u[i]);
        }

        this.attr = new THREE.BufferAttribute(this.positions, 3);
        this.attr.setUsage(THREE.DynamicDrawUsage);
        this.geometry.setAttribute("position", this.attr);
        this.geometry.setAttribute("color", new THREE.BufferAttribute(this.colors, 3));

        this.material = new THREE.PointsMaterial({
          color: 0xffffff,
          size: 0.038,
          map: particleTexture,
          vertexColors: true,
          transparent: true,
          opacity: 0,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
          sizeAttenuation: true,
          alphaTest: 0.02
        });

        this.points = new THREE.Points(this.geometry, this.material);
        this.life = 1;
        this.targetLife = 1;
        this.dissolving = false;
        scene.add(this.points);
      }

      startDissolve() {
        this.dissolving = true;
        this.targetLife = 0;
      }

      dispose() {
        scene.remove(this.points);
        this.geometry.dispose();
        this.material.dispose();
      }

      update(t) {
        const a = this.aSphere.currentPos;
        const b = this.bSphere.currentPos;
        const delta = new THREE.Vector3().subVectors(b, a);
        const distance = delta.length();

        this.life = lerp(this.life, this.targetLife, this.dissolving ? 0.07 : 0.12);

        if (distance < 0.001) {
          this.material.opacity = lerp(this.material.opacity, 0, 0.10);
          return;
        }

        const dir = delta.clone().normalize();
        const helper = Math.abs(dir.z) < 0.86
          ? new THREE.Vector3(0, 0, 1)
          : new THREE.Vector3(0, 1, 0);
        const axis1 = new THREE.Vector3().crossVectors(dir, helper).normalize();
        const axis2 = new THREE.Vector3().crossVectors(dir, axis1).normalize();

        // follower가 원본 중심에서 빠져나온 직후에는 브리지를 잠깐 숨겨
        // 파티클이 표면 접합점까지 이동할 시간을 준다. 이후 표면에서부터
        // 서서히 드러나므로 중심에서 줄이 솟는 플래시가 보이지 않는다.
        const visibility = smootherstep(0.045, 0.32, distance) * this.life;
        const p = this.positions;

        const radiusA = Math.max(0.08, this.aSphere.currentRadius);
        const radiusB = Math.max(0.08, this.bSphere.currentRadius);
        const minRadius = Math.max(0.08, Math.min(radiusA, radiusB));
        const stretched = smootherstep(0.55, 2.9, distance);

        // --------------------------------------------------------
        // 브리지의 중심선을 구체 중심(a/b)이 아니라 두 구체가 서로 마주보는
        // '표면 근처'에서 시작/종료시킨다.
        // 너무 가까운 순간에는 두 표면점이 서로 교차하지 않도록 거리 비례로
        // inset을 자동 축소한다. 이렇게 해야 첫 구체의 중심에서 줄이 뻗는
        // 느낌이 사라지고, 표면에서 새 덩어리가 싹트듯 분열해 보인다.
        // --------------------------------------------------------
        const rawInsetA = radiusA * 0.84;
        const rawInsetB = radiusB * 0.84;
        const maxInsetSum = distance * 0.88;
        const insetScale = Math.min(1, maxInsetSum / Math.max(0.0001, rawInsetA + rawInsetB));
        const insetA = rawInsetA * insetScale;
        const insetB = rawInsetB * insetScale;

        const bridgeStart = a.clone().addScaledVector(dir, insetA);
        const bridgeEnd = b.clone().addScaledVector(dir, -insetB);

        // 표면의 작은 패치에서 목이 생겨나는 형태.
        // 기존처럼 endpoint를 거의 구 반지름만큼 키우면 중심을 관통하는
        // 두꺼운 튜브처럼 보이기 때문에, 표면 접합부는 적당히 넓고
        // 중앙은 부드럽게 잘록해지도록 바꾼다.
        const neckRadius = minRadius * lerp(0.30, 0.15, stretched);
        const endpointA = Math.max(neckRadius, radiusA * 0.42);
        const endpointB = Math.max(neckRadius, radiusB * 0.42);

        // 핵심: 구체와 브리지의 "점 밀도" 자체를 맞춘다.
        // 이전에는 작은 연결 면적에 2천 개가 넘는 점이 몰려 AdditiveBlending으로
        // 브리지만 새하얗게 보였다. 실제 브리지 표면적을 대략 계산해 구체 표면과
        // 비슷한 면적당 파티클 수만 draw한다.
        const bridgeLength = bridgeStart.distanceTo(bridgeEnd);
        const avgBridgeRadius = (endpointA + endpointB + neckRadius * 2) * 0.25;
        const estimatedBridgeArea = Math.max(0.001, 2 * Math.PI * avgBridgeRadius * bridgeLength);
        const referenceSphereArea = Math.max(0.001, 4 * Math.PI * minRadius * minRadius);
        const densityMatchedCount = Math.round(
          PARTICLE_COUNT * (estimatedBridgeArea / referenceSphereArea) * 0.90
        );
        const visibleConnectorCount = THREE.MathUtils.clamp(densityMatchedCount, 120, CONNECTOR_COUNT);
        this.geometry.setDrawRange(0, visibleConnectorCount);

        for (let i = 0; i < CONNECTOR_COUNT; i++) {
          const j = i * 3;
          // 미세한 longitudinal drift로 정적인 원통 느낌을 없앤다.
          const rawU = this.u[i] + Math.sin(t * 0.34 + this.phase[i]) * 0.0028;
          const u = clamp01(rawU);
          const theta = this.angle[i] + Math.sin(t * 0.38 + this.phase[i]) * 0.055;

          // quintic easing을 사용해 구체 표면 → 목 부분이 눈에 띄는 경계 없이 이어지게 한다.
          const edge = Math.abs(u * 2 - 1);
          const edgeBlend = smootherstep(0.10, 0.94, Math.pow(edge, 0.78));
          const endpointRadius = lerp(endpointA, endpointB, u);
          const profile = lerp(neckRadius, endpointRadius, edgeBlend);

          // 아주 약한 유기적 맥동. 중앙에서만 조금 더 살아 움직인다.
          const middleWeight = Math.pow(Math.sin(Math.PI * u), 2);
          const pulse = 1 + Math.sin(t * 0.92 + this.phase[i]) * 0.026 * middleWeight;
          const r = profile * this.radial[i] * pulse * visibility;

          // 중심-중심이 아니라 표면-표면을 잇는다.
          // 양 끝은 구체 안쪽으로 아주 살짝 파고들어 파티클 밀도가 자연스럽게
          // 겹치고, 중앙으로 갈수록 독립된 목 형태가 드러난다.
          const surfaceU = smootherstep(0.0, 1.0, u);
          let cx = lerp(bridgeStart.x, bridgeEnd.x, surfaceU);
          let cy = lerp(bridgeStart.y, bridgeEnd.y, surfaceU);
          let cz = lerp(bridgeStart.z, bridgeEnd.z, surfaceU);

          // 박수 해체 시 연결부도 독립된 점 구름처럼 바깥으로 풀려난다.
          const clapScatter = smootherstep(0.0, 1.0, clapDissolve);
          const scatterPhase = this.phase[i];
          cx += Math.cos(scatterPhase * 1.71) * CLAP_SCATTER_DISTANCE * 0.72 * clapScatter;
          cy += Math.sin(scatterPhase * 1.37) * CLAP_SCATTER_DISTANCE * 0.72 * clapScatter;
          cz += Math.sin(scatterPhase * 2.11) * CLAP_SCATTER_DISTANCE * 0.58 * clapScatter;

          // 완전한 직선 대신 거의 느껴지지 않을 정도의 흐름을 주어 유기적으로 연결.
          const drift = Math.sin(t * 0.47 + this.phase[i] * 0.73) * 0.018 * minRadius * middleWeight;
          cx += axis1.x * drift + axis2.x * drift * 0.35;
          cy += axis1.y * drift + axis2.y * drift * 0.35;
          cz += axis1.z * drift + axis2.z * drift * 0.35;

          const ox = axis1.x * Math.cos(theta) * r + axis2.x * Math.sin(theta) * r;
          const oy = axis1.y * Math.cos(theta) * r + axis2.y * Math.sin(theta) * r;
          const oz = axis1.z * Math.cos(theta) * r + axis2.z * Math.sin(theta) * r;

          // 연결부 끝은 구체 표면에 더 빠르게 붙고, 중앙은 조금 느리게 따라가도록 한다.
          // 그래서 손을 빠르게 움직여도 양 끝이 떨어져 보이지 않으면서 가운데만 점성 있게 늘어난다.
          const edgeFollow = Math.pow(edge, 1.7);
          const followEase = lerp(0.15, 0.34, edgeFollow);
          p[j] += (cx + ox - p[j]) * followEase;
          p[j + 1] += (cy + oy - p[j + 1]) * followEase;
          p[j + 2] += (cz + oz - p[j + 2]) * followEase;
        }

        this.attr.needsUpdate = true;
        const clapFade = 1 - smootherstep(0.30, 0.985, clapDissolve);
        // 밀도를 구체와 맞췄으므로 밝기/점 크기도 구체와 거의 같은 값으로 사용한다.
        // 이제 연결부만 별도 색처럼 밝아지지 않고 하나의 파티클 표면처럼 이어진다.
        const targetOpacity = 0.90 * visibility * clapFade;
        this.material.opacity = lerp(this.material.opacity, targetOpacity, this.dissolving ? 0.08 : 0.075);
        const sphereLikePointSize = lerp(0.048, 0.035, map01(minRadius, 0.18, 1.15));
        this.material.size = lerp(this.material.size, sphereLikePointSize, 0.10);
      }
    }

    // ============================================================
    // 5. 인터랙션 상태
    // ============================================================
    let cloneMode = false;
    let pointStartTime = null;
    let flickArmed = false;
    let lastFlickTime = -Infinity;
    let pointReleaseStartTime = null;
    let bentHoldStartTime = null;
    let lastHandSeenAt = performance.now();
    let handSeen = false;
    let firstHandSeen = false;

    // 박수 소리 판정 상태
    let lastClapTime = -Infinity;
    let audioContext = null;
    let microphoneSource = null;
    let audioAnalyser = null;
    let audioTimeData = null;
    let audioFreqData = null;
    let microphoneReady = false;
    let microphoneStream = null;
    let audioNoiseFloor = 0.012;
    let previousAudioRms = 0;

    const handTarget = new THREE.Vector3();
    const smoothedHandTarget = new THREE.Vector3();

    const baseSphere = new ParticleSphere(new THREE.Vector3(0, 0, 0), 1.03);
    let activeSphere = baseSphere;
    const lockedSpheres = [];
    const bridges = [];
    const dissolvingBridges = [];
    const dissolvingSpheres = [];

    // 회전 상태
    let hasHandOrientation = false;
    const smoothedHandQuaternion = new THREE.Quaternion();
    const handStartQuaternion = new THREE.Quaternion();
    const sphereStartQuaternion = new THREE.Quaternion();
    const tempInverseQuaternion = new THREE.Quaternion();
    const tempDeltaQuaternion = new THREE.Quaternion();
    const tempAppliedQuaternion = new THREE.Quaternion();
    const tempEuler = new THREE.Euler(0, 0, 0, "YXZ");
    let rotationReferenceReady = false;

    // ============================================================
    // 6. 손 제스처 분석
    // ============================================================
    function getPalmCenter(lm) {
      const ids = [0, 5, 9, 13, 17];
      const c = { x: 0, y: 0, z: 0 };
      for (const id of ids) {
        c.x += lm[id].x;
        c.y += lm[id].y;
        c.z += lm[id].z ?? 0;
      }
      c.x /= ids.length;
      c.y /= ids.length;
      c.z /= ids.length;
      return c;
    }

    function getOpenness(lm, palm) {
      const palmWidth = dist3(lm[5], lm[17]);
      if (palmWidth < 0.0001) return 0.5;
      const tips = [4, 8, 12, 16, 20];
      let sum = 0;
      for (const id of tips) sum += dist3(lm[id], palm);
      return map01((sum / tips.length) / palmWidth, OPENNESS_MIN, OPENNESS_MAX);
    }

    function fingerExtended(lm, tipId, pipId, mcpId, palm) {
      const dTip = dist3(lm[tipId], palm);
      const dPip = dist3(lm[pipId], palm);
      const dMcp = dist3(lm[mcpId], palm);
      return dTip > dPip * 1.09 && dTip > dMcp * 1.17;
    }

    function indexStraightness(lm) {
      const direct = dist3(lm[5], lm[8]);
      const path = dist3(lm[5], lm[6]) + dist3(lm[6], lm[7]) + dist3(lm[7], lm[8]);
      if (path < 1e-6) return 1;
      return clamp01(direct / path);
    }

    function getGestureState(lm, palm) {
      const index = fingerExtended(lm, 8, 6, 5, palm);
      const middle = fingerExtended(lm, 12, 10, 9, palm);
      const ring = fingerExtended(lm, 16, 14, 13, palm);
      const pinky = fingerExtended(lm, 20, 18, 17, palm);
      const othersFolded = !middle && !ring && !pinky;
      const pointing = index && othersFolded;
      const openRelease = index && middle && ring && pinky;
      const releaseFingerCount = [middle, ring, pinky].filter(Boolean).length;
      return {
        pointing,
        othersFolded,
        openRelease,
        releaseFingerCount,
        indexStraight: indexStraightness(lm)
      };
    }

    function getHandOrientationQuaternion(lm) {
      const toVec3 = (p) => new THREE.Vector3(
        0.5 - p.x,
        0.5 - p.y,
        -(p.z ?? 0) * 1.75
      );

      const wrist = toVec3(lm[0]);
      const indexMcp = toVec3(lm[5]);
      const middleMcp = toVec3(lm[9]);
      const pinkyMcp = toVec3(lm[17]);

      const xAxis = indexMcp.clone().sub(pinkyMcp);
      const yHint = middleMcp.clone().sub(wrist);
      if (xAxis.lengthSq() < 1e-8 || yHint.lengthSq() < 1e-8) return null;
      xAxis.normalize();
      yHint.normalize();

      const zAxis = new THREE.Vector3().crossVectors(xAxis, yHint);
      if (zAxis.lengthSq() < 1e-8) return null;
      zAxis.normalize();
      const yAxis = new THREE.Vector3().crossVectors(zAxis, xAxis).normalize();

      return new THREE.Quaternion()
        .setFromRotationMatrix(new THREE.Matrix4().makeBasis(xAxis, yAxis, zAxis))
        .normalize();
    }

    function beginRotationReference() {
      if (!hasHandOrientation || !activeSphere) return;
      handStartQuaternion.copy(smoothedHandQuaternion);
      sphereStartQuaternion.copy(activeSphere.points.quaternion);
      activeSphere.targetQuaternion.copy(activeSphere.points.quaternion);
      rotationReferenceReady = true;
    }

    function updateActiveSphereRotation() {
      if (!hasHandOrientation || !rotationReferenceReady || !activeSphere) return;

      tempInverseQuaternion.copy(handStartQuaternion).invert();
      tempDeltaQuaternion.copy(smoothedHandQuaternion).multiply(tempInverseQuaternion).normalize();
      tempEuler.setFromQuaternion(tempDeltaQuaternion, "YXZ");
      tempEuler.x = THREE.MathUtils.clamp(tempEuler.x * ROTATION_GAIN_X, -MAX_ROTATION_DELTA, MAX_ROTATION_DELTA);
      tempEuler.y = THREE.MathUtils.clamp(tempEuler.y * ROTATION_GAIN_Y, -MAX_ROTATION_DELTA, MAX_ROTATION_DELTA);
      tempEuler.z = THREE.MathUtils.clamp(tempEuler.z * ROTATION_GAIN_Z, -MAX_ROTATION_DELTA, MAX_ROTATION_DELTA);
      tempAppliedQuaternion.setFromEuler(tempEuler);

      activeSphere.targetQuaternion
        .copy(tempAppliedQuaternion)
        .multiply(sphereStartQuaternion)
        .normalize();
    }

    function mapPalmToScene(lm, palm) {
      const palmWidth = dist3(lm[5], lm[17]);
      return new THREE.Vector3(
        (0.5 - palm.x) * 4.5,
        (0.5 - palm.y) * 3.05,
        lerp(-0.34, 0.58, map01(palmWidth, 0.08, 0.30))
      );
    }

    // ============================================================
    // 7. Clone Mode 상태 머신
    // ============================================================
    function enableCloneMode(nowMs) {
      if (cloneMode) return;
      cloneMode = true;
      pointStartTime = null;
      pointReleaseStartTime = null;
      bentHoldStartTime = null;
      flickArmed = true; // 포인팅 상태에서 들어오므로 즉시 까딱임 대기
      lastFlickTime = nowMs - FLICK_REARM_MS;

      // 포인팅 순간부터 구 크기를 일정하게 만들어 복제 형태를 선명하게 유지
      activeSphere.targetRadius = FOLLOWER_RADIUS;
      activeSphere.targetSpread = 0.07;

      modeEl.textContent = "CLONE MODE · 까딱 = FIX / 포인팅 해제 = CLEAR";
      statusEl.textContent = "복제 모드 ON · 검지를 까딱하면 현재 위치에 구체가 고정됩니다";
      statusEl.classList.remove("hide");
      setTimeout(() => statusEl.classList.add("hide"), 1800);
    }

    function spawnFollowerFrom(sourceSphere) {
      const follower = new ParticleSphere(sourceSphere.currentPos.clone(), 0.08);
      follower.currentRadius = 0.08;
      follower.targetRadius = 0.08;
      follower.currentSpread = 0.24;
      follower.targetSpread = 0.12;
      follower.material.opacity = 0.0;
      follower.life = 0.0;
      follower.targetLife = 0.0;
      follower.emerging = true;
      follower.locked = false;
      follower.lockPosition = null;
      follower.sourceSphere = sourceSphere;
      follower.targetQuaternion.copy(sourceSphere.points.quaternion);
      follower.points.quaternion.copy(sourceSphere.points.quaternion);

      const bridge = new ParticleBridge(sourceSphere, follower);
      bridges.push(bridge);
      activeSphere = follower;
      beginRotationReference();
    }

    function lockAndClone(nowMs) {
      if (!cloneMode || !activeSphere) return;

      // 새 follower가 거의 원본 위치에 겹쳐 있을 때 연속 오인식을 방지
      if (activeSphere.emerging && activeSphere.sourceSphere) {
        const d = activeSphere.currentPos.distanceTo(activeSphere.sourceSphere.currentPos);
        if (d < LOCK_MIN_DISTANCE) {
          statusEl.textContent = "손을 조금 이동한 뒤 다시 검지를 까딱해주세요";
          statusEl.classList.remove("hide");
          setTimeout(() => statusEl.classList.add("hide"), 900);
          return;
        }
      }

      activeSphere.locked = true;
      activeSphere.emerging = false;
      // 현재 보이는 위치를 별도 anchor로 저장한다.
      // 이후 activeSphere가 새 follower로 바뀌어도 이 구체는 절대 손을 따라가지 않는다.
      activeSphere.lockPosition = activeSphere.currentPos.clone();
      activeSphere.lockQuaternion.copy(activeSphere.points.quaternion);
      activeSphere.targetPos.copy(activeSphere.lockPosition);
      activeSphere.targetQuaternion.copy(activeSphere.lockQuaternion);
      activeSphere.targetRadius = FOLLOWER_RADIUS;
      activeSphere.targetSpread = 0.07;
      activeSphere.targetLife = 1;
      activeSphere.life = Math.max(activeSphere.life, 0.98);
      if (!lockedSpheres.includes(activeSphere)) lockedSpheres.push(activeSphere);

      // 첫 구체를 포함하여 최대 개수 제한
      if (lockedSpheres.length >= MAX_SPHERES) {
        statusEl.textContent = `최대 ${MAX_SPHERES}개까지 생성됩니다 · R 키로 초기화`;
        statusEl.classList.remove("hide");
        setTimeout(() => statusEl.classList.add("hide"), 1200);
        activeSphere = lockedSpheres[lockedSpheres.length - 1];
        return;
      }

      const justLocked = activeSphere;
      spawnFollowerFrom(justLocked);
      lastFlickTime = nowMs;

      statusEl.textContent = `구체 ${lockedSpheres.length}개 고정 · 손을 옮긴 뒤 다시 까딱하세요`;
      statusEl.classList.remove("hide");
      setTimeout(() => statusEl.classList.add("hide"), 1000);
    }

    function exitCloneModeSoft() {
      if (!cloneMode) return;

      cloneMode = false;
      pointStartTime = null;
      pointReleaseStartTime = null;
      bentHoldStartTime = null;
      flickArmed = false;
      modeEl.textContent = "NORMAL · 검지 포인팅으로 CLONE MODE";

      // base sphere 외 복제 구체는 자신이 태어난 이전 구체 쪽으로 수축하며 사라진다.
      const extras = new Set([...lockedSpheres, activeSphere]);
      extras.delete(baseSphere);
      extras.forEach((sphere) => {
        if (!sphere || sphere.dissolving) return;
        const collapseTarget = sphere.sourceSphere?.currentPos ?? baseSphere.currentPos;
        sphere.startDissolve(collapseTarget.clone());
        dissolvingSpheres.push(sphere);
      });

      // 브리지도 즉시 끊지 않고 같은 속도로 fade-out시켜 연결이 자연스럽게 풀린다.
      bridges.forEach((bridge) => {
        bridge.startDissolve();
        dissolvingBridges.push(bridge);
      });
      bridges.length = 0;
      lockedSpheres.length = 0;

      activeSphere = baseSphere;
      baseSphere.locked = false;
      baseSphere.lockPosition = null;
      baseSphere.emerging = false;
      baseSphere.sourceSphere = null;
      baseSphere.targetLife = 1;
      baseSphere.life = Math.max(baseSphere.life, 0.9);
      beginRotationReference();

      statusEl.textContent = "포인팅 종료 · 복제된 구체를 해체합니다";
      statusEl.classList.remove("hide");
      setTimeout(() => statusEl.classList.add("hide"), 900);
    }

    function resetScene() {
      cloneMode = false;
      pointStartTime = null;
      flickArmed = false;
      modeEl.textContent = "NORMAL · 검지 포인팅으로 CLONE MODE";

      // baseSphere 외 구체/브리지는 부드럽게 사라짐
      const allExtra = new Set([...lockedSpheres, activeSphere]);
      allExtra.delete(baseSphere);
      allExtra.forEach((s) => {
        if (s && !s.dissolving) {
          s.startDissolve(new THREE.Vector3(0, 0, 0));
          dissolvingSpheres.push(s);
        }
      });

      bridges.forEach((b) => b.dispose());
      bridges.length = 0;
      dissolvingBridges.forEach((b) => b.dispose());
      dissolvingBridges.length = 0;
      lockedSpheres.length = 0;

      activeSphere = baseSphere;
      baseSphere.locked = false;
      baseSphere.lockPosition = null;
      baseSphere.emerging = false;
      baseSphere.sourceSphere = null;
      baseSphere.targetPos.set(0, 0, 0);
      baseSphere.currentRadius = 0.24;
      baseSphere.targetRadius = 1.03;
      baseSphere.currentSpread = 0.85;
      baseSphere.targetSpread = 0.075;
      baseSphere.life = 1;
      baseSphere.targetLife = 1;
      baseSphere.material.opacity = 0.93;
      beginRotationReference();

      statusEl.textContent = "초기화 · 하나의 구체로 돌아왔습니다";
      statusEl.classList.remove("hide");
      setTimeout(() => statusEl.classList.add("hide"), 1200);
    }

    function processCloneGestures(gesture, nowMs) {
      if (!cloneMode) {
        if (gesture.pointing) {
          if (pointStartTime == null) pointStartTime = nowMs;
          if (nowMs - pointStartTime >= POINT_TRIGGER_MS) {
            enableCloneMode(nowMs);
          }
        } else {
          pointStartTime = null;
        }
        return;
      }

      // 포인팅 자세를 유지하면 종료 타이머를 취소.
      if (gesture.pointing) {
        pointReleaseStartTime = null;
        bentHoldStartTime = null;
      } else if (gesture.openRelease || gesture.releaseFingerCount >= 2) {
        // 실제 포인팅 해제는 중지/약지/소지 중 2개 이상이 확실히 펴진 상태가
        // 일정 시간 유지될 때만 인정한다. 손을 이동하는 중 발생하는 1~2프레임의
        // landmark 흔들림 때문에 clone chain 전체가 사라지는 현상을 막는다.
        if (pointReleaseStartTime == null) pointReleaseStartTime = nowMs;
        if (nowMs - pointReleaseStartTime >= POINT_RELEASE_MS) {
          exitCloneModeSoft();
          return;
        }
      } else {
        // 검지 까딱임 또는 손 이동 중 순간적인 비포인팅은 clone mode 해제로 보지 않는다.
        pointReleaseStartTime = null;
      }

      // 복제 모드에서는 중지/약지/소지가 접혀 있을 때만 검지 까딱임을 받는다.
      if (!gesture.othersFolded) {
        flickArmed = false;
        return;
      }

      if (!flickArmed) {
        if (
          gesture.indexStraight >= FLICK_ARM_STRAIGHTNESS &&
          nowMs - lastFlickTime >= FLICK_REARM_MS
        ) {
          flickArmed = true;
          bentHoldStartTime = null;
        } else if (gesture.indexStraight <= FLICK_BEND_STRAIGHTNESS) {
          if (bentHoldStartTime == null) bentHoldStartTime = nowMs;
          // flick 후 검지를 계속 접은 채 유지하면 포인팅을 끝낸 것으로 간주.
          if (nowMs - bentHoldStartTime >= FLICK_HOLD_EXIT_MS) {
            exitCloneModeSoft();
          }
        }
        return;
      }

      if (gesture.indexStraight <= FLICK_BEND_STRAIGHTNESS) {
        flickArmed = false;
        bentHoldStartTime = nowMs;
        lastFlickTime = nowMs;
        lockAndClone(nowMs);
      }
    }

    // ============================================================
    // 8. 박수 감지 / 전체 해체 ↔ 복원
    // ============================================================
    function clearCloneStateWhileBlack() {
      if (clapCleanupDone) return;
      clapCleanupDone = true;
      clapCleanupPending = false;

      // 화면이 완전히 검게 된 뒤 복제 구조를 정리한다.
      // 따라서 사라지는 순간까지는 현재 보이던 모든 구체와 브리지가 함께 해체된다.
      const extraSpheres = new Set([...lockedSpheres, activeSphere, ...dissolvingSpheres]);
      extraSpheres.delete(baseSphere);
      extraSpheres.forEach((sphere) => sphere?.dispose());

      bridges.forEach((bridge) => bridge.dispose());
      dissolvingBridges.forEach((bridge) => bridge.dispose());
      bridges.length = 0;
      dissolvingBridges.length = 0;
      dissolvingSpheres.length = 0;
      lockedSpheres.length = 0;

      cloneMode = false;
      pointStartTime = null;
      pointReleaseStartTime = null;
      bentHoldStartTime = null;
      flickArmed = false;

      activeSphere = baseSphere;
      baseSphere.locked = false;
      baseSphere.lockPosition = null;
      baseSphere.emerging = false;
      baseSphere.sourceSphere = null;
      baseSphere.dissolving = false;
      baseSphere.life = 1;
      baseSphere.targetLife = 1;
      baseSphere.targetPos.set(0, 0, 0);
      baseSphere.targetRadius = 1.03;
      baseSphere.targetSpread = 0.075;
      baseSphere.targetQuaternion.identity();

      rotationReferenceReady = false;
      modeEl.textContent = "NORMAL · 검지 포인팅으로 CLONE MODE";
    }

    function toggleClapState(nowMs) {
      if (nowMs - lastClapTime < CLAP_COOLDOWN_MS) return;
      lastClapTime = nowMs;

      if (!clapBlack) {
        // 첫 박수: 현재 보이는 모든 구체/연결부를 그대로 입자화한 뒤 사라지게 한다.
        clapBlack = true;
        clapDissolveTarget = 1;
        clapCleanupPending = true;
        clapCleanupDone = false;
        modeEl.textContent = "CLAP · DISSOLVING";
        statusEl.textContent = "박수 감지 · 구체가 점으로 해체됩니다";
        statusEl.classList.remove("hide");
        setTimeout(() => document.body.classList.add("clap-black"), 480);
      } else {
        // 두 번째 박수: 검은 화면 속에 남아 있는 흩어진 점들이 역순으로 모여 한 구체를 만든다.
        clapBlack = false;
        clapDissolveTarget = 0;
        document.body.classList.remove("clap-black");
        modeEl.textContent = "RESTORING · 박수 역재생";
        statusEl.textContent = "박수 감지 · 점들이 다시 모여 구체를 만듭니다";
        statusEl.classList.remove("hide");
        setTimeout(() => statusEl.classList.add("hide"), 1800);
      }
    }

    function updateAudioClapDetection(nowMs) {
      if (!microphoneReady || !audioAnalyser || !audioTimeData || !audioFreqData) return false;
      if (audioContext?.state === "suspended") return false;

      audioAnalyser.getFloatTimeDomainData(audioTimeData);
      audioAnalyser.getByteFrequencyData(audioFreqData);

      let sumSq = 0;
      let peak = 0;
      for (let i = 0; i < audioTimeData.length; i++) {
        const v = audioTimeData[i];
        sumSq += v * v;
        peak = Math.max(peak, Math.abs(v));
      }
      const rms = Math.sqrt(sumSq / audioTimeData.length);
      const onset = rms - previousAudioRms;
      previousAudioRms = rms;
      const crest = peak / Math.max(0.0001, rms);

      // 박수는 보통 비교적 넓은 주파수 대역을 포함한다.
      const nyquist = audioContext.sampleRate * 0.5;
      const binHz = nyquist / audioFreqData.length;
      const highStart = Math.max(1, Math.floor(1800 / binHz));
      let allEnergy = 0;
      let highEnergy = 0;
      for (let i = 1; i < audioFreqData.length; i++) {
        const e = audioFreqData[i] / 255;
        const ee = e * e;
        allEnergy += ee;
        if (i >= highStart) highEnergy += ee;
      }
      const highRatio = highEnergy / Math.max(0.0001, allEnergy);

      // 큰 transient가 아닐 때만 주변 소음 기준치를 천천히 갱신한다.
      if (rms < Math.max(CLAP_MIN_RMS * 1.35, audioNoiseFloor * 2.1)) {
        audioNoiseFloor = lerp(audioNoiseFloor, rms, CLAP_NOISE_ADAPT);
      }

      const dynamicThreshold = Math.max(CLAP_MIN_RMS, audioNoiseFloor * CLAP_NOISE_MULTIPLIER);
      const clapLike =
        rms >= dynamicThreshold &&
        peak >= CLAP_MIN_PEAK &&
        onset >= CLAP_MIN_ONSET &&
        crest >= CLAP_MIN_CREST &&
        highRatio >= CLAP_MIN_HIGH_RATIO &&
        nowMs - lastClapTime >= CLAP_COOLDOWN_MS;

      if (clapLike) {
        toggleClapState(nowMs);
        micStatusEl.textContent = "MIC · CLAP";
        setTimeout(() => {
          if (microphoneReady) micStatusEl.textContent = "MIC · LISTENING";
        }, 500);
        return true;
      }
      return false;
    }

    async function startMicrophone(audioStream) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) throw new Error("이 브라우저는 Web Audio API를 지원하지 않습니다.");

      microphoneStream = audioStream;
      audioContext = new AudioCtx();
      audioAnalyser = audioContext.createAnalyser();
      audioAnalyser.fftSize = 1024;
      audioAnalyser.smoothingTimeConstant = 0.05;
      audioAnalyser.minDecibels = -90;
      audioAnalyser.maxDecibels = -10;

      microphoneSource = audioContext.createMediaStreamSource(audioStream);
      microphoneSource.connect(audioAnalyser);
      audioTimeData = new Float32Array(audioAnalyser.fftSize);
      audioFreqData = new Uint8Array(audioAnalyser.frequencyBinCount);

      // Chrome/Safari의 autoplay 정책 때문에 처음에는 suspended일 수 있다.
      // 첫 클릭/터치에서 자동으로 resume한다.
      const resumeAudio = async () => {
        if (audioContext?.state === "suspended") {
          try { await audioContext.resume(); } catch (_) {}
        }
        if (audioContext?.state === "running") {
          microphoneReady = true;
          micStatusEl.textContent = "MIC · LISTENING";
          window.removeEventListener("pointerdown", resumeAudio);
          window.removeEventListener("keydown", resumeAudio);
        }
      };

      await resumeAudio();
      if (audioContext.state !== "running") {
        micStatusEl.textContent = "MIC · 화면을 한 번 클릭";
        window.addEventListener("pointerdown", resumeAudio);
        window.addEventListener("keydown", resumeAudio);
      } else {
        microphoneReady = true;
        micStatusEl.textContent = "MIC · LISTENING";
      }
    }

    // ============================================================
    // 9. MediaPipe
    // ============================================================
    let handLandmarker = null;
    let lastDetectAt = -Infinity;
    let lastVideoTime = -1;
    let lastOpenness = 0.55;

    async function createHandLandmarker() {
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
      );

      const options = {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numHands: 1,
        minHandDetectionConfidence: 0.55,
        minHandPresenceConfidence: 0.55,
        minTrackingConfidence: 0.5
      };

      try {
        return await HandLandmarker.createFromOptions(vision, options);
      } catch (gpuError) {
        console.warn("GPU delegate failed. Falling back to CPU.", gpuError);
        options.baseOptions.delegate = "CPU";
        return await HandLandmarker.createFromOptions(vision, options);
      }
    }

    async function startCameraAndMicrophone() {
      if (!navigator.mediaDevices?.getUserMedia) {
        throw new Error("이 브라우저는 카메라/마이크 API를 지원하지 않습니다.");
      }

      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: "user",
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: {
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl: false
        }
      });

      const videoTracks = stream.getVideoTracks();
      const audioTracks = stream.getAudioTracks();

      const videoOnlyStream = new MediaStream(videoTracks);
      video.srcObject = videoOnlyStream;
      await video.play();

      if (audioTracks.length) {
        const audioOnlyStream = new MediaStream(audioTracks);
        await startMicrophone(audioOnlyStream);
      } else {
        micStatusEl.textContent = "MIC · 권한 필요";
      }
    }

    async function initHandTracking() {
      statusEl.textContent = "카메라와 마이크 권한을 허용해주세요";
      await startCameraAndMicrophone();
      statusEl.textContent = "손 인식 모델을 준비하는 중...";
      handLandmarker = await createHandLandmarker();
      statusEl.textContent = "포인팅 = 복제 모드 · 박수 소리 = 전체 해체/복원";
    }

    function processHand(lm, nowMs) {
      const palm = getPalmCenter(lm);
      const openness = getOpenness(lm, palm);
      const gesture = getGestureState(lm, palm);
      lastOpenness = openness;

      handTarget.copy(mapPalmToScene(lm, palm));

      // 손바닥 3D 방향 — 손 모양과 상관없이 회전 추적
      const rawHandQuaternion = getHandOrientationQuaternion(lm);
      if (rawHandQuaternion) {
        if (!hasHandOrientation) {
          smoothedHandQuaternion.copy(rawHandQuaternion);
          hasHandOrientation = true;
          beginRotationReference();
        } else {
          smoothedHandQuaternion.slerp(rawHandQuaternion, 0.30);
        }
      }

      processCloneGestures(gesture, nowMs);
      updateActiveSphereRotation();

      if (!firstHandSeen) {
        firstHandSeen = true;
        statusEl.classList.add("hide");
      }
    }

    function updateHandTracking(nowMs) {
      if (!handLandmarker || video.readyState < 2) return;
      if (nowMs - lastDetectAt < DETECTION_INTERVAL_MS) return;
      if (video.currentTime === lastVideoTime) return;

      lastDetectAt = nowMs;
      lastVideoTime = video.currentTime;

      const result = handLandmarker.detectForVideo(video, nowMs);
      const hands = result.landmarks ?? [];
      const lm = hands[0];
      handSeen = Boolean(lm);

      // 완전 해체 상태/전환 중에는 박수 감지만 유지하고 다른 인터랙션은 잠근다.
      const clapTransitionActive = clapDissolve > 0.035 || clapDissolveTarget > 0.5;
      if (lm && !clapTransitionActive) {
        lastHandSeenAt = nowMs;
        processHand(lm, nowMs);
      } else if (!lm) {
        pointStartTime = null;
        hasHandOrientation = false;
        rotationReferenceReady = false;
        if (!clapTransitionActive && cloneMode && nowMs - lastHandSeenAt >= HAND_LOST_EXIT_MS) {
          exitCloneModeSoft();
        }
      }
    }

    // ============================================================
    // 10. 애니메이션
    // ============================================================
    function updateScene(t) {
      // 박수 해체/복원 전역 진행도
      const clapEase = clapDissolveTarget > clapDissolve
        ? CLAP_DISSOLVE_EASE
        : CLAP_RESTORE_EASE;
      clapDissolve = lerp(clapDissolve, clapDissolveTarget, clapEase);
      if (Math.abs(clapDissolve - clapDissolveTarget) < 0.0008) {
        clapDissolve = clapDissolveTarget;
      }

      // 완전히 검게 된 순간에만 복제 상태를 정리한다.
      if (clapCleanupPending && clapDissolve > 0.985) {
        clearCloneStateWhileBlack();
      }

      const clapInteractionLocked = clapDissolve > 0.035 || clapDissolveTarget > 0.5;

      if (handSeen && !clapInteractionLocked) {
        smoothedHandTarget.lerp(handTarget, 0.13);
      }

      if (!clapInteractionLocked && !cloneMode) {
        // 기존 인터랙션: 한 개 구체가 손 위치/펼침 정도를 따름
        if (handSeen) {
          activeSphere.targetPos.copy(smoothedHandTarget);
          activeSphere.targetRadius = lerp(0.34, 1.42, lastOpenness);
          activeSphere.targetSpread = lerp(0.018, 0.24, lastOpenness);
        } else {
          activeSphere.targetPos.lerp(new THREE.Vector3(0, 0, 0), 0.03);
          activeSphere.targetRadius = 1.02;
          activeSphere.targetSpread = 0.07;
        }
      } else if (!clapInteractionLocked) {
        // 복제 모드: 현재 active sphere만 손을 따라감.
        // locked sphere는 해당 위치에 고정.
        if (activeSphere && !activeSphere.locked && handSeen) {
          activeSphere.targetPos.copy(smoothedHandTarget);

          if (activeSphere.emerging && activeSphere.sourceSphere) {
            const d = activeSphere.sourceSphere.currentPos.distanceTo(smoothedHandTarget);
            const emergence = smootherstep(0.035, FOLLOWER_FULL_DISTANCE, d);
            activeSphere.targetRadius = lerp(0.05, FOLLOWER_RADIUS, emergence);
            activeSphere.targetSpread = lerp(0.28, 0.07, emergence);
            activeSphere.targetLife = emergence;
          } else {
            activeSphere.targetRadius = FOLLOWER_RADIUS;
            activeSphere.targetSpread = 0.07;
          }
        }
      }

      // 모든 구체 업데이트
      const sphereSet = new Set([baseSphere, ...lockedSpheres, activeSphere, ...dissolvingSpheres]);
      sphereSet.forEach((sphere) => sphere?.update(t));

      bridges.forEach((bridge) => bridge.update(t));
      dissolvingBridges.forEach((bridge) => bridge.update(t));

      // 사라진 브리지 메모리 정리
      for (let i = dissolvingBridges.length - 1; i >= 0; i--) {
        const bridge = dissolvingBridges[i];
        if (bridge.life < 0.025 && bridge.material.opacity < 0.025) {
          bridge.dispose();
          dissolvingBridges.splice(i, 1);
        }
      }

      // 사라진 구체 메모리 정리
      for (let i = dissolvingSpheres.length - 1; i >= 0; i--) {
        const s = dissolvingSpheres[i];
        if (s.life < 0.025) {
          s.dispose();
          dissolvingSpheres.splice(i, 1);
        }
      }

      if (!clapBlack && clapDissolveTarget === 0 && clapDissolve < 0.025) {
        modeEl.textContent = "NORMAL · 검지 포인팅으로 CLONE MODE";
      }
    }

    function animate(nowMs = performance.now()) {
      requestAnimationFrame(animate);
      updateAudioClapDetection(nowMs);
      updateHandTracking(nowMs);
      updateScene(clock.getElapsedTime());
      renderer.render(scene, camera);
    }

    // ============================================================
    // 11. 리사이즈 / 디버그 / 초기화
    // ============================================================
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });

    window.addEventListener("keydown", (e) => {
      const key = e.key.toLowerCase();
      if (key === "d") video.classList.toggle("debug");
      if (key === "r") resetScene();
      // C 키는 박수 전환을 테스트하기 위한 디버그용 수동 트리거
      if (key === "c") toggleClapState(performance.now());
    });

    animate();

    initHandTracking().catch((err) => {
      console.error(err);
      statusEl.classList.remove("hide");
      statusEl.textContent =
        "카메라/마이크를 시작하지 못했습니다. VSCode Live Server(localhost)에서 열고 카메라와 마이크 권한을 확인해주세요.";
    });
  </script>
</body>
